/* ==================================================================
 * 9. 页面渲染：私信
 * ================================================================== */

/* ---- 9.0 「已读」状态的本地持久化 ----
 * 已读是不可逆状态：一旦标记为已读，刷新页面 / 重新登录后都不会再变回未读。
 * 消息标识用「联系人 + 时间 + 内容」—— 预设数据的这三个字段固定不变，可作为稳定主键。
 * 想恢复初始未读状态：清空 localStorage 即可。
 */
function msgKeyOf(contact, m) {
  return contact + '|' + m.time + '|' + m.text;
}

function loadReadMarks() {
  try { return JSON.parse(localStorage.getItem(READ_STORE_KEY)) || {}; } catch (e) { return {}; }
}

function saveReadMark(username, contact, m) {
  var marks = loadReadMarks();
  if (!marks[username]) marks[username] = {};
  var key = msgKeyOf(contact, m);
  if (marks[username][key]) return;
  marks[username][key] = 1;
  try { localStorage.setItem(READ_STORE_KEY, JSON.stringify(marks)); } catch (e) { /* 隐私模式下忽略 */ }
}

/* 把持久化的已读状态套用到刚初始化的 chatStore 上 */
function restoreReadMarks(username) {
  var marks = loadReadMarks()[username] || {};
  var inbox = chatStore[username] || {};
  Object.keys(inbox).forEach(function (contact) {
    inbox[contact].forEach(function (m) {
      if (marks[msgKeyOf(contact, m)]) m.read = true;
    });
  });
}

function initChatStore() {
  chatStore = {};
  // 好友里可能出现 USERS 之外的氛围账号（如 GDJgugugu），也要为它们建会话
  var names = USERS.map(function (u) { return u.username; });
  Object.keys(FRIENDS).forEach(function (name) {
    if (names.indexOf(name) === -1) names.push(name);
  });
  names.forEach(function (name) {
    chatStore[name] = {};
    friendsOf(name).forEach(function (contact) {
      var preset = (PRESET_CHATS[name] || {})[contact] || [];
      chatStore[name][contact] = preset.map(function (m) {
        return { from: m.from, text: m.text, time: m.time, read: !m.unread };
      });
    });
  });
  // 套用本地已读记录：读过的消息不会因为刷新而重新变成未读
  USERS.forEach(function (u) { restoreReadMarks(u.username); });
}

/* ---- 9.0.1 私信剧情：向好友发送含关键词的私信时，对方逐条自动回复 ----
 * 回复写入会话并计为未读；若此刻正在看这个会话，就同步刷新气泡
 * （未读会在 renderMessages 里「看到 2 秒后」自动转为已读）。
 */
/* 触发记录 + 上下文标记：user|contact -> 标记表（只存在内存里，刷新即重置） */
var STORY_STATE = {};
function storyFlagsOf(user, contact) {
  var key = user + '|' + contact;
  if (!STORY_STATE[key]) STORY_STATE[key] = {};
  return STORY_STATE[key];
}

/* 按顺序找出第一条命中的规则；没有命中返回 null
 * flags 为当前会话的触发记录：带 unless 的规则在其标记已存在时跳过
 */
function autoReplyHit(contact, text, flags) {
  var rules = AUTO_REPLY[contact] || [];
  for (var i = 0; i < rules.length; i++) {
    var rule = rules[i];
    if (rule.all && !rule.all.every(function (k) { return text.indexOf(k) > -1; })) continue;
    if (rule.any && !rule.any.some(function (k) { return text.indexOf(k) > -1; })) continue;
    if (rule.unless && flags[rule.unless]) continue;
    return rule;
  }
  return null;
}

function scheduleAutoReply(user, contact, text) {
  var flags = storyFlagsOf(user, contact);
  var rule = autoReplyHit(contact, text, flags);
  if (!rule) return;
  if (rule.once && flags[rule.once]) return;      // 这条回复已经出现过了
  if (rule.once) flags[rule.once] = true;         // 先占位，避免连发多条时重复触发
  if (rule.mark) flags[rule.mark] = true;

  var replies = typeof rule.replies === 'function' ? rule.replies(flags) : rule.replies;
  replies.forEach(function (line, i) {
    setTimeout(function () {
      pushIncomingLine(user, contact, line);
    }, AUTO_REPLY_MS + i * AUTO_REPLY_GAP_MS);
  });
}

/* 往会话里追加一条「对方发来的」消息，并按需刷新界面 */
function pushIncomingLine(user, contact, line) {
  // 期间若退出登录 / 会话被清空，就不再追发
  var now = currentUser();
  if (!now || now.username !== user) return;
  var inbox = chatStore[user];
  if (!inbox || !inbox[contact]) return;
  inbox[contact].push({ from: contact, text: line, time: nowTime(), read: false });

  if (state.routeName === 'messages' && state.activeChat[user] === contact) {
    var keepFocus = document.activeElement && document.activeElement.id === 'chatInput';
    renderMessages();
    if (keepFocus) {
      var input = document.getElementById('chatInput');
      if (input) input.focus();
    }
  }
  renderNav();
}

/* 某条「收到的」消息其后是否存在我发出的消息（即我已经回复过它） */
function repliedAfter(list, index, me) {
  for (var i = index + 1; i < list.length; i++) {
    if (list[i].from === me.username) return true;
  }
  return false;
}

/* 消息的展示态：true = 已读
 * 已读的三种情况：自己发出的 / 已被标记为已读 / 已经被我回复过（回复即视为已读）
 */
function isMsgRead(list, index, me) {
  var m = list[index];
  if (m.from === me.username) return true;
  if (m.read) return true;
  return repliedAfter(list, index, me);
}

/* 某个会话的未读消息数（只统计「收到的」且尚未读的消息），用于联系人栏红点 */
function unreadCountOf(user, contact) {
  if (!user || !contact) return 0;
  var list = (chatStore[user.username] || {})[contact] || [];
  return list.filter(function (m, i) { return !isMsgRead(list, i, user); }).length;
}

/* 未读私信总数：用于导航栏红点 */
function unreadCount(user) {
  if (!user) return 0;
  var inbox = chatStore[user.username] || {};
  return Object.keys(inbox).reduce(function (total, contact) {
    return total + unreadCountOf(user, contact);
  }, 0);
}

/* 某个会话里是否还有「收到的」未读消息 */
function hasUnreadIn(user, contact) {
  if (!user || !contact) return false;
  var list = (chatStore[user.username] || {})[contact] || [];
  return list.some(function (m, i) { return !isMsgRead(list, i, user); });
}

/* 把某条「收到的」消息标记为已读（并写入本地记录）；返回是否有变化 */
function markOneRead(user, contact, index) {
  if (!user || !contact) return false;
  var list = (chatStore[user.username] || {})[contact] || [];
  var m = list[index];
  if (!m || m.from === user.username || m.read) return false;
  m.read = true;
  saveReadMark(user.username, contact, m);
  return true;
}

/* 把某个会话里「收到的」未读消息全部标记为已读；返回是否有变化
 * 已读是不可逆状态，不存在「已读 → 未读」的路径 */
function markConversationRead(user, contact) {
  if (!user || !contact) return false;
  var list = (chatStore[user.username] || {})[contact] || [];
  var changed = false;
  list.forEach(function (m, i) {
    if (markOneRead(user, contact, i)) changed = true;
  });
  return changed;
}

/* 「看到消息 2 秒后自动已读」的定时器 */
var MSG_AUTO_READ_MS = 2000;
var msgReadTimer = null;
function clearMsgReadTimer() {
  if (msgReadTimer) { clearTimeout(msgReadTimer); msgReadTimer = null; }
}

function renderMessages() {
  var me = currentUser();
  if (!me) {
    app.innerHTML = needLoginHTML('私信功能需要登录后使用');
    return;
  }

  var contacts = friendsOf(me.username).map(getUser).filter(Boolean);
  var active = state.activeChat[me.username];
  var exists = contacts.some(function (c) { return c.username === active; });
  if (!exists) active = contacts.length ? contacts[0].username : null;
  state.activeChat[me.username] = active;

  var contactHTML = contacts.map(function (c) {
    var msgs = chatStore[me.username][c.username] || [];
    var last = msgs.length ? msgs[msgs.length - 1].text : '还没有聊天记录';
    var unread = unreadCountOf(me, c.username);
    return '<button type="button" class="contact' + (c.username === active ? ' active' : '') +
      '" data-contact="' + c.username + '">' +
        '<img class="avatar-sm" src="' + c.avatar + '" alt="">' +
        '<div style="min-width:0;flex:1">' +
          '<div class="contact-name">' + esc(c.nickname) + '</div>' +
          '<div class="contact-last">' + esc(last) + '</div>' +
        '</div>' +
        (unread ? '<span class="contact-badge">' + (unread > 99 ? '99+' : unread) + '</span>' : '') +
      '</button>';
  }).join('');

  var msgs = active ? (chatStore[me.username][active] || []) : [];
  var bubbleHTML = msgs.length ? msgs.map(function (m, i) {
    var mine = m.from === me.username;
    // 收到的消息带「已读 / 未读」标签；已被回复过的消息自动视为已读
    var stateTag = mine ? '' :
      (isMsgRead(msgs, i, me)
        ? '<span class="msg-state read">已读</span>'
        : '<button type="button" class="msg-state unread" data-action="msg-read" data-idx="' + i + '" ' +
          'title="点击立即标为已读">未读</button>');
    return '<div class="bubble-row' + (mine ? ' mine' : '') + '">' +
      '<img class="avatar-sm" src="' + avatarOf(m.from) + '" alt="">' +
      '<div class="bubble">' + esc(m.text) + '</div>' +
      '<div class="bubble-time">' + esc(m.time) + '</div>' +
      stateTag +
    '</div>';
  }).join('') : '<div class="empty" style="padding:30px 0">还没有聊过天，打个招呼吧～</div>';

  app.innerHTML =
    '<div class="page-head">' +
      '<h2 class="page-title">我的私信</h2>' +
      '<span class="page-sub">预设会话 · 已读状态保存在本地，刷新后不会变回未读</span>' +
    '</div>' +
    '<div class="msg-layout">' +
      '<div class="contact-list">' + contactHTML + '</div>' +
      '<div class="chat-panel">' +
        '<div class="chat-head">' + (active ? esc(nickOf(active)) : '请选择联系人') + '</div>' +
        '<div class="chat-body" id="chatBody">' + bubbleHTML + '</div>' +
        '<form class="chat-foot" data-form="chat">' +
          '<input class="input" id="chatInput" type="text" autocomplete="off" ' +
            'placeholder="输入消息…">' +
          '<button class="btn-primary" type="submit">发送</button>' +
        '</form>' +
      '</div>' +
    '</div>';

  scrollChatBottom();

  // 看到消息 2 秒后，把当前会话里收到的未读消息自动标记为已读
  clearMsgReadTimer();
  if (me && active && hasUnreadIn(me, active)) {
    var watchUser = me.username, watchContact = active;
    msgReadTimer = setTimeout(function () {
      msgReadTimer = null;
      // 已经离开私信页 / 切换了账号或会话，则不再处理
      if (state.routeName !== 'messages') return;
      var now = currentUser();
      if (!now || now.username !== watchUser) return;
      if (state.activeChat[watchUser] !== watchContact) return;
      if (markConversationRead(now, watchContact)) {
        renderMessages();
        renderNav();
      }
    }, MSG_AUTO_READ_MS);
  }
}

function scrollChatBottom() {
  var body = document.getElementById('chatBody');
  if (body) body.scrollTop = body.scrollHeight;
}

/* ---- 9.1 收到新消息：屏幕顶部的条状提示 ----
 * 同一时刻只展示一条，后来者排队；提示条自动滑走或手动关闭后，自动展示下一条。
 * 提示条不遮罩页面，也不影响其它功能的使用。
 */

var msgBarCurrent = null;      // 正在展示的那条
var msgBarQueue = [];          // 排队等待展示的消息
var msgBarTimer = null;        // 自动滑走的定时器

function clearMsgBarTimer() {
  if (msgBarTimer) { clearTimeout(msgBarTimer); msgBarTimer = null; }
}

/* 收到一条新消息：没有正在展示的提示就直接弹出，否则先排队 */
function showMsgNotice(contact, text) {
  var item = { contact: contact, text: text };
  if (msgBarCurrent) {
    msgBarQueue.push(item);
    if (msgBarQueue.length > MAX_MSG_QUEUE) msgBarQueue.shift();
  } else {
    msgBarCurrent = item;
  }
  renderMsgBar();
}

/* 关闭当前这条（手动关 / 自动滑走）；队列里还有就接着展示下一条 */
function dismissMsgBar() {
  msgBarCurrent = msgBarQueue.shift() || null;
  renderMsgBar();
}

/* 关闭全部提示（退出登录时用） */
function clearMsgNotices() {
  msgBarCurrent = null;
  msgBarQueue = [];
  renderMsgBar();
}

function renderMsgBar() {
  var wrap = document.getElementById('msgBarWrap');
  var bar = document.getElementById('msgBar');
  if (!wrap || !bar) return;

  clearMsgBarTimer();

  // 隐藏：先滑出（外层 overflow:hidden 会把它裁掉，不占位、不可点），再清空内容
  if (!msgBarCurrent) {
    bar.classList.remove('in');
    wrap.setAttribute('aria-hidden', 'true');
    setTimeout(function () {
      if (!msgBarCurrent && bar) { bar.innerHTML = ''; bar.removeAttribute('data-user'); }
    }, 300);
    return;
  }

  var contact = msgBarCurrent.contact;
  var user = getUser(contact);
  bar.setAttribute('data-action', 'open-msg');
  bar.setAttribute('data-user', contact);
  bar.innerHTML =
    '<div class="msgbar-inner">' +
      '<span class="msgbar-icon">✉</span>' +
      '<img class="avatar-xs" src="' + (user ? user.avatar : PLACEHOLDER_AVATAR) + '" alt="">' +
      '<span class="msgbar-name">' + esc(user ? user.nickname : contact) + '</span>' +
      '<span class="msgbar-badge">新消息</span>' +
      '<span class="msgbar-text">' + esc(msgBarCurrent.text) + '</span>' +
      (msgBarQueue.length ? '<span class="msgbar-queue">还有 ' + msgBarQueue.length + ' 条</span>' : '') +
      '<button type="button" class="btn-primary" data-action="open-msg" data-user="' +
        esc(contact) + '">查看会话</button>' +
      '<button type="button" class="msgbar-close" data-action="dismiss-msg" title="关闭">×</button>' +
    '</div>';
  wrap.setAttribute('aria-hidden', 'false');

  // 先移除 .in 再重新挂，保证连续展示下一条时也有滑入动画
  bar.classList.remove('in');
  msgBarTimer = setTimeout(function () {
    bar.classList.add('in');
    msgBarTimer = setTimeout(dismissMsgBar, MSG_BAR_MS);
  }, 20);
}

/* ---- 9.2 模拟「收到新消息」的推送定时器 ----
 * 功能验证完成后已关闭（MSG_PUSH_ENABLED = false）：不会自动产生新消息，
 * 也不会创建任何定时器。把 MSG_PUSH_ENABLED 设为 true 即可恢复自动推送。
 */

var msgPushTimer = null;
var msgPushSeq = 0;                       // 依次取预设文案，避免随机重复

function startMsgPushTimer() {
  stopMsgPushTimer();
  if (!MSG_PUSH_ENABLED) return;          // 已关闭自动推送
  if (!currentUser()) return;             // 未登录不推送
  msgPushTimer = setInterval(pushIncomingMessage, MSG_PUSH_MS);
}

function stopMsgPushTimer() {
  if (msgPushTimer) { clearInterval(msgPushTimer); msgPushTimer = null; }
}

/* 让随机一个联系人发来一条预设消息：写入会话 + 顶部提示条 + 刷新红点
 * （自动推送已关闭，此函数仅保留供手动演示 / 以后恢复自动推送时使用） */
function pushIncomingMessage() {
  var me = currentUser();
  if (!me) { stopMsgPushTimer(); return; }

  var inbox = chatStore[me.username];
  if (!inbox) return;
  var contacts = Object.keys(inbox);
  if (!contacts.length) return;

  // 优先挑当前没在看的会话，这样红点 / 未读标签的变化才看得见
  var open = state.routeName === 'messages' ? state.activeChat[me.username] : null;
  var candidates = contacts.filter(function (c) { return c !== open; });
  if (!candidates.length) candidates = contacts;
  var contact = candidates[Math.floor(Math.random() * candidates.length)];

  var text = INCOMING_POOL[msgPushSeq % INCOMING_POOL.length];
  msgPushSeq++;
  inbox[contact].push({ from: contact, text: text, time: nowTime(), read: false });

  renderNav();                                  // 导航栏红点 +1
  if (state.routeName === 'messages') renderMessages();   // 正在私信页则同步联系人栏与气泡
  showMsgNotice(contact, text);
}

/* ==================================================================
 * 10. 路由
 * ================================================================== */

/* ---- 10.0 页面编号（pageId）----
 * 编号只保存在标签页内部（sessionStorage，每个标签页一份），不再写进网址。
 * - 刷新保持编号：当前编号记在 PID_KEY 里
 * - 新标签页继承编号：搜索前先把目标页码写进 NEXT_PID_KEY，window.open 打开同源新标签页时
 *   浏览器会克隆当前标签页的 sessionStorage，新页面读到「交接编号」后取用并删除；
 *   原标签页在 window.open 之后立刻清掉交接键，所以自身编号不受影响
 * - 站内链接跳转（<a href="#/...">）不经过 URL 传参，编号自然保持不变
 */
var PID_KEY = 'plpl_pid';                 // 本标签页当前编号
var NEXT_PID_KEY = 'plpl_next_pid';       // 交给新标签页的编号（一次性）

/* ---- 10.0.1 进度关键词表 ----
 * 只有搜索命中这张表里的关键词，页码才会推进；其它搜索只是普通搜索，编号不变。
 * key：  玩家输入的关键词（小写，用于包含匹配）
 * page： 命中后要跳转到的页码；不写则默认为当前页码 + 1
 * label：用于提示与调试的可读名称
 */
var PROGRESS_KEYWORDS = [
  { key: '咕嘟', page: 2, label: '咕。咕。咕。' },
  { key: '404',   page: 3, label: '触发 404' },
  { key: 'ghost', page: 4, label: '找到 ghost' },
  { key: 'final', page: 5, label: '最终关' }
  // 后续可以继续添加
];

/* 是否命中进度关键词：忽略大小写、去首尾空格、支持包含匹配（"进入地下室" 命中 "地下室"） */
function matchProgressKeyword(q) {
  var key = String(q || '').trim().toLowerCase();
  if (!key) return null;
  for (var i = 0; i < PROGRESS_KEYWORDS.length; i++) {
    if (key.indexOf(PROGRESS_KEYWORDS[i].key.toLowerCase()) > -1) return PROGRESS_KEYWORDS[i];
  }
  return null;
}

/* 本标签页当前编号（内存值，刷新与跳转都保持不变） */
var currentPageId = 1;

/* 读取一个编号：不是 1 ~ TOTAL_PAGES 的整数就返回 null（含未设置、被手动改坏的情况） */
function readStoredPid(key) {
  try {
    var raw = sessionStorage.getItem(key);
    var n = parseInt(raw, 10);
    if (isNaN(n) || String(n) !== String(raw) || n < 1 || n > TOTAL_PAGES) return null;
    return n;
  } catch (e) { return null; }
}
function writeStoredPid(key, pid) {
  try { sessionStorage.setItem(key, String(pid)); } catch (e) { /* 隐私模式下忽略 */ }
}
function removeStoredPid(key) {
  try { sessionStorage.removeItem(key); } catch (e) { /* 隐私模式下忽略 */ }
}

/* 本标签页的编号：优先取「交接编号」（从搜索打开的新标签页），否则取本标签页上次的编号 */
function initPageId() {
  var handoff = readStoredPid(NEXT_PID_KEY);
  removeStoredPid(NEXT_PID_KEY);            // 无论是否合法都清掉，避免留下脏值
  if (handoff !== null) {
    currentPageId = handoff;
  } else {
    var saved = readStoredPid(PID_KEY);
    currentPageId = saved !== null ? saved : 1;
  }
  writeStoredPid(PID_KEY, currentPageId);
}

/* 当前页面的编号：永远是 1 ~ TOTAL_PAGES 之间的整数 */
function getPageId() { return currentPageId; }

/* 修改本标签页编号（兜底在当前页打开搜索页时用） */
function setPageId(pid) {
  currentPageId = pid;
  writeStoredPid(PID_KEY, pid);
}

/* 页脚显示编号，格式：pageId / TOTAL_PAGES */
function updatePageCounter() {
  var el = document.getElementById('pageCounter');
  if (el) el.textContent = getPageId() + ' / ' + TOTAL_PAGES;
}

function parseHash() {
  var hash = location.hash.slice(1) || '/home';
  var query = {};
  var qi = hash.indexOf('?');
  if (qi > -1) {
    var qs = hash.slice(qi + 1);
    hash = hash.slice(0, qi);
    qs.split('&').forEach(function (pair) {
      if (!pair) return;
      var kv = pair.split('=');
      query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
    });
  }
  var parts = hash.split('/').filter(function (p) { return p !== ''; });
  return { parts: parts, query: query };
}

function syncNav() {
  var name = state.routeName;
  var links = document.querySelectorAll('#navLinks a');
  for (var i = 0; i < links.length; i++) {
    var nav = links[i].getAttribute('data-nav');
    // 详情 / 搜索 / 用户主页等页面统一高亮「首页」
    var isActive = nav === name ||
      (nav === 'home' && ['post', 'video', 'search', 'user'].indexOf(name) > -1);
    links[i].className = isActive ? 'active' : '';
  }
  // 同步搜索框内容
  document.getElementById('searchInput').value = state.searchQuery || '';
}

function router() {
  var r = parseHash();
  var name = r.parts[0] || 'home';
  state.routeName = name;
  clearAdTimer();      // 只有首页会重新启动轮换

  if (name === 'home') {
    renderHome();
  } else if (name === 'post' || name === 'video') {
    // #/video/:id 作为旧链接的兼容别名，同样渲染内容详情页
    renderPost(r.parts[1]);
  } else if (name === 'dynamic') {
    renderDynamic();
  } else if (name === 'space') {
    var tab = r.query.tab;
    if (tab && ['works', 'favorites', 'creator'].indexOf(tab) > -1) state.spaceTab = tab;
    renderSpace();
  } else if (name === 'user') {
    renderUser(r.parts[1]);
  } else if (name === 'login') {
    renderLogin();
  } else if (name === 'messages') {
    // 支持 #/messages?to=GDJgugugu：直接打开与某个好友的会话（弹窗提示的「查看会话」用）
    var meRoute = currentUser();
    var toUser = r.query.to;
    if (meRoute && toUser && (chatStore[meRoute.username] || {})[toUser] !== undefined) {
      state.activeChat[meRoute.username] = toUser;
    }
    renderMessages();
  } else if (name === 'search') {
    var q = r.query.q || '';
    if (state.searchQuery !== q) {   // 关键词变化时回到第一页
      state.searchQuery = q;
      state.searchPage = 1;
    }
    renderSearch();
  } else {
    app.innerHTML = emptyHTML('页面走丢了', '没有找到这个页面，返回首页看看吧');
  }

  syncNav();
  renderNav();
  updatePageCounter();     // 刷新页脚里的页面编号
  window.scrollTo(0, 0);
}

/* ==================================================================
 * 11. 顶部导航栏（登录状态区）
 * ================================================================== */
function renderNav() {
  var area = document.getElementById('userArea');
  var me = currentUser();

  // 私信红点：只显示未读消息数量；全部已读时移除红点
  var badge = document.getElementById('msgBadge');
  if (badge) {
    var unread = unreadCount(me);
    if (unread > 0) {
      badge.textContent = unread > 99 ? '99+' : String(unread);
      badge.style.display = '';
    } else {
      badge.textContent = '';
      badge.style.display = 'none';
    }
  }

  if (me) {
    area.innerHTML =
      '<div class="user-chip" id="userChip">' +
        '<img class="avatar-xs" src="' + me.avatar + '" alt="">' +
        '<span>' + esc(me.nickname) + '</span>' +
      '</div>' +
      '<div class="dropdown" id="userDropdown">' +
        '<a href="#/space">我的空间</a>' +
        '<a href="#/messages">我的私信</a>' +
        '<div class="dropdown-item" data-action="logout">退出登录</div>' +
      '</div>';
  } else {
    area.innerHTML = '<a class="btn-primary login-btn" href="#/login">登录</a>';
  }
}

function doLogout() {
  saveCurrentUsername(null);
  stopMsgPushTimer();      // 退出后不再模拟收到新消息
  clearMsgNotices();
  toast('已退出登录');
  // 私信页需要登录权限，退出后立即刷新当前页面
  router();
}

/* ==================================================================
 * 12. 搜索
 * ================================================================== */
/* 搜索：在新标签页打开搜索结果页（网址里不再带编号，编号走 sessionStorage 交接）
 * - 命中「进度关键词」：新页面页码推进（跳到指定页码，或当前页码 + 1）
 * - 未命中：只是普通搜索，新页面页码与当前相同，进度不变
 * 当前标签页的路由、内容与编号都保持原样
 * 注意：window.open 必须由用户点击 / 回车同步触发，不要在页面加载或定时器里调用，否则会被拦截
 */
function doSearch() {
  var input = document.getElementById('searchInput');
  var q = (input.value || '').trim();
  if (!q) { toast('请输入搜索关键词'); return; }

  var currentPid = getPageId();
  var hit = matchProgressKeyword(q);
  var targetPid = currentPid;              // 未命中：进度不变

  if (hit) {
    var nextPid = hit.page ? hit.page : currentPid + 1;
    if (nextPid > TOTAL_PAGES) nextPid = TOTAL_PAGES;
    if (nextPid === currentPid && currentPid === TOTAL_PAGES) {
      toast('已经是最后一页了');
      return;
    }
    targetPid = nextPid;
  }

  // 搜索结果页地址（不含编号）
  var base = (location.origin && location.origin !== 'null')
    ? location.origin + location.pathname       // 绝对地址，任意子路径都能打开
    : location.href.split('#')[0];              // file:// 下 origin 为 "null" 时的兜底
  var url = base + '#/search?q=' + encodeURIComponent(q);

  // 先把目标页码放进「交接键」，新标签页创建时会克隆当前标签页的 sessionStorage 读到它
  writeStoredPid(NEXT_PID_KEY, targetPid);
  var win = window.open(url, '_blank');
  removeStoredPid(NEXT_PID_KEY);           // 立即清掉，避免影响本标签页自己刷新时的编号

  if (!win) {
    // 被浏览器拦截：兜底在当前标签页打开（本标签页直接采用新编号）
    setPageId(targetPid);
    location.href = url;
    toast('新标签页被拦截，已在当前页打开');
    return;
  }

  // 已在新标签页打开：清空搜索框，但不动当前标签页的路由、内容与编号
  input.value = '';

  if (hit) toast('进度推进：' + hit.label + ' → 第 ' + targetPid + ' 页');
}

/* ==================================================================
 * 13. 全局事件绑定（事件委托）
 * ================================================================== */
document.addEventListener('click', function (e) {
  if (!(e.target instanceof Element)) return;

  // 分页按钮
  var pbtn = e.target.closest('.page-btn[data-page]');
  if (pbtn && !pbtn.disabled) {
    var page = Number(pbtn.getAttribute('data-page'));
    if (pbtn.getAttribute('data-pager') === 'home') {
      state.homePage = page;
      renderHome();
    } else {
      state.searchPage = page;
      renderSearch();
    }
    window.scrollTo(0, 0);
    return;
  }

  // 关闭弹窗
  if (e.target.closest('[data-action="close-modal"]')) { closeModal(); return; }
  // 点击遮罩空白处也关闭弹窗
  if (e.target.id === 'modalMask') { closeModal(); return; }

  // 广告：点击左右箭头手动切换（切换后重新计时，保证每次都能看满 4 秒）
  var adNav = e.target.closest('[data-action="ad-prev"], [data-action="ad-next"]');
  if (adNav) {
    var dir = adNav.getAttribute('data-action') === 'ad-prev' ? -1 : 1;
    setAdSlide(state.adIndex + dir);
    startAdTimer();
    return;
  }

  // 上传作品：仅 UI，提示功能维护中
  if (e.target.closest('[data-action="upload"]')) {
    openModal('上传作品', '该功能维护中', '🛠️');
    return;
  }

  // 创作者中心：左右按钮横向切换折线图对应的作品
  var chartNav = e.target.closest('[data-action="chart-prev"], [data-action="chart-next"]');
  if (chartNav) {
    var chMe = currentUser();
    if (chMe) {
      var dir = chartNav.getAttribute('data-action') === 'chart-prev' ? -1 : 1;
      setChartIndex(worksOf(chMe.username), state.chartIndex + dir);
    }
    return;
  }

  // 展开 / 收起关注列表（自己的个人空间与他人名片页共用；列表项本身是链接，可跳转到对方主页）
  var followBtn = e.target.closest('[data-action="toggle-following"]');
  if (followBtn) {
    var followUser = followBtn.getAttribute('data-user');
    var meFollow = currentUser();
    if (meFollow && followUser === meFollow.username && state.routeName === 'space') {
      state.showFollowing = !state.showFollowing;
      renderSpace();
    } else if (followUser) {
      state.followPanel[followUser] = !state.followPanel[followUser];
      renderUser(followUser);
    }
    return;
  }

  // 个人空间标签切换
  var tab = e.target.closest('[data-action="space-tab"]');
  if (tab) {
    var key = tab.getAttribute('data-tab');
    if (location.hash === '#/space') {
      state.spaceTab = key;   // 已在个人空间页内，直接切换标签
      renderSpace();
    } else {
      location.hash = '#/space?tab=' + key;
    }
    return;
  }

  // 伪播放器
  var play = e.target.closest('[data-action="fake-play"]');
  if (play) { toast('伪站不能播放哦，这里只有一个占位图～'); return; }

  // 作品赞 / 踩（可交互，再次点击取消）
  var like = e.target.closest('[data-action="post-like"]');
  if (like) {
    var lid = like.getAttribute('data-post');
    state.postVote[lid] = state.postVote[lid] === 'like' ? null : 'like';
    renderPost(lid);
    return;
  }
  var dislike = e.target.closest('[data-action="post-dislike"]');
  if (dislike) {
    var did = dislike.getAttribute('data-post');
    state.postVote[did] = state.postVote[did] === 'dislike' ? null : 'dislike';
    renderPost(did);
    return;
  }

  // 评论赞 / 踩
  var clike = e.target.closest('[data-action="comment-like"]');
  if (clike) {
    var cpid = clike.getAttribute('data-post'), cidx = clike.getAttribute('data-idx');
    var ckey = commentKey(cpid, cidx);
    var liked = state.commentVote[ckey] !== 'like';   // 本次点击后的目标状态
    state.commentVote[ckey] = liked ? 'like' : null;

    // 作者对自己作品评论区的点赞：点赞显示「作者赞过」，取消点赞同步移除标签
    var cp = getPost(cpid), meNow = currentUser();
    if (meNow && cp && isOwner(cp, meNow)) {
      state.authorLiked[ckey] = liked;
    }
    renderPost(cpid);
    return;
  }
  var cdislike = e.target.closest('[data-action="comment-dislike"]');
  if (cdislike) {
    var dpid = cdislike.getAttribute('data-post'), didx = cdislike.getAttribute('data-idx');
    var dkey = commentKey(dpid, didx);
    state.commentVote[dkey] = state.commentVote[dkey] === 'dislike' ? null : 'dislike';
    renderPost(dpid);
    return;
  }

  // 展开 / 收起固定回复（不提供输入框，回复内容不可编辑）
  var rep = e.target.closest('[data-action="toggle-replies"]');
  if (rep) {
    var rpid = rep.getAttribute('data-post'), ridx = rep.getAttribute('data-idx');
    var rkey = commentKey(rpid, ridx);
    state.showReplies[rkey] = !state.showReplies[rkey];
    renderPost(rpid);
    return;
  }

  // 评论区开关：仅作者可设置
  var sw = e.target.closest('[data-action="toggle-comments"]');
  if (sw) {
    var spid = sw.getAttribute('data-post');
    var sp = getPost(spid), meOwner = currentUser();
    if (!isOwner(sp, meOwner)) { toast('只有作品作者可以设置评论区状态'); return; }
    sp.commentsEnabled = !sp.commentsEnabled;
    toast(sp.commentsEnabled ? '已开启评论区' : '已关闭评论区');
    renderPost(spid);
    return;
  }

  // 图文帖画廊：点缩略图切换
  var thumb = e.target.closest('[data-thumb]');
  if (thumb) {
    setGalleryImage(thumb.getAttribute('data-post'), Number(thumb.getAttribute('data-thumb')));
    return;
  }

  // 图文帖画廊：上一张 / 下一张
  var gnav = e.target.closest('[data-gallery]');
  if (gnav) {
    var gid = gnav.getAttribute('data-post');
    setGalleryImage(gid, (state.gallery[gid] || 0) + Number(gnav.getAttribute('data-gallery')));
    return;
  }

  // 私信：点击「未读」标签立即标为已读（单向，已读不可改回未读）
  var mread = e.target.closest('[data-action="msg-read"]');
  if (mread) {
    var meMsg = currentUser();
    var openContact = meMsg && state.activeChat[meMsg.username];
    var list = meMsg && openContact ? (chatStore[meMsg.username] || {})[openContact] : null;
    var mIdx = Number(mread.getAttribute('data-idx'));
    if (list && list[mIdx] && markOneRead(meMsg, openContact, mIdx)) {
      toast('已标记为已读');
      renderMessages();
      renderNav();
    }
    return;
  }

  // 收到新消息的提示条：关闭 / 查看会话（关闭优先判断，它是提示条内的子元素）
  if (e.target.closest('[data-action="dismiss-msg"]')) {
    dismissMsgBar();
    return;
  }

  var msgOpen = e.target.closest('[data-action="open-msg"]');
  if (msgOpen) {
    var popUser = msgOpen.getAttribute('data-user');
    var mePop = currentUser();
    clearMsgNotices();
    if (!mePop) { location.hash = '#/login'; return; }
    state.activeChat[mePop.username] = popUser;
    if (state.routeName === 'messages') {   // 已在私信页：hash 不变不会触发路由，直接重渲染
      renderMessages();
      renderNav();
    } else {
      location.hash = '#/messages?to=' + encodeURIComponent(popUser);
    }
    return;
  }

  // 切换私信联系人：只切换会话，未读消息会在「看到 2 秒后」自动变为已读
  var contact = e.target.closest('[data-contact]');
  if (contact) {
    var me = currentUser();
    if (me) {
      state.activeChat[me.username] = contact.getAttribute('data-contact');
      renderMessages();
      renderNav();
    }
    return;
  }

  // 用户下拉菜单
  var chip = e.target.closest('#userChip');
  if (chip) {
    var dd = document.getElementById('userDropdown');
    if (dd) dd.classList.toggle('open');
    e.stopPropagation();
    return;
  }

  // 退出登录
  var logout = e.target.closest('[data-action="logout"]');
  if (logout) { doLogout(); return; }

  // 点击其它区域收起下拉菜单
  var dropdown = document.getElementById('userDropdown');
  if (dropdown) dropdown.classList.remove('open');
});

/* 表单提交：登录 / 评论 / 私信 */
document.addEventListener('submit', function (e) {
  var form = e.target;
  if (!form || !form.getAttribute) return;
  var type = form.getAttribute('data-form');
  if (!type) return;
  e.preventDefault();

  // ---- 登录 ----
  if (type === 'login') {
    var username = ((form.elements.username || {}).value || '').trim();
    var password = (form.elements.password || {}).value || '';
    if (!username || !password) { toast('请填写用户名和密码'); return; }
    // 氛围账号（假账号 / NPC）不可登录
    if (isExtraAccount(username)) {
      toast('该账号为演示用氛围账号，无法登录');
      return;
    }
    var u = USERS.filter(function (x) {
      return x.username === username && x.password === password;
    })[0];
    if (!u) { toast('用户名或密码错误，请使用页面下方提示的测试账号'); return; }
    saveCurrentUsername(u.username);
    toast('欢迎回来，' + u.nickname + '！');
    renderNav();
    startMsgPushTimer();
    location.hash = '#/home';
    return;
  }

  // ---- 发表评论（不真的显示） ----
  if (type === 'comment') {
    var input = form.querySelector('input[name="commentText"]');
    var text = (input.value || '').trim();
    if (!text) { toast('评论内容不能为空'); return; }
    input.value = '';
    toast('评论已提交，等待审核');
    return;
  }

  // ---- 发送私信（仅本地） ----
  if (type === 'chat') {
    var me2 = currentUser();
    if (!me2) return;
    var chatInput = document.getElementById('chatInput');
    var msg = (chatInput.value || '').trim();
    if (!msg) return;
    var to = state.activeChat[me2.username];
    if (!to) return;
    chatStore[me2.username][to].push({ from: me2.username, text: msg, time: nowTime(), read: false });
    renderMessages();
    renderNav();
    var newInput = document.getElementById('chatInput');
    if (newInput) newInput.focus();
    scheduleAutoReply(me2.username, to, msg);
    return;
  }
});

/* 搜索框：回车 / 点击按钮 */
document.getElementById('searchInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
});
document.getElementById('searchBtn').addEventListener('click', doSearch);

/* Esc：关闭「收到新消息」的顶部提示条 */
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && msgBarCurrent) dismissMsgBar();
});

/* 路由监听 */
window.addEventListener('hashchange', router);

/* ==================================================================
 * 14. 启动
 * ================================================================== */
function init() {
  initChatStore();
  initPageId();                                   // 读取本标签页的页面编号（新标签页则取交接编号）
  if (!location.hash) location.hash = '#/home';    // 默认进入首页
  renderNav();
  router();
  startMsgPushTimer();                            // 已登录则开始模拟收到新消息
}

init();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>噼里啪啦</title>
<style>
/* ==================== 全局与主题 ==================== */
:root{
  --brand:#65e2a6;        /* 主题色：品牌面（按钮 / 角标 / 选中态背景） */
  --brand-hover:#4ed598;  /* 品牌面悬停 */
  --brand-ink:#12a56f;    /* 同色系深绿：用于文字 / 图标，保证在浅色背景上的可读性 */
  --brand-soft:#e9fbf3;   /* 浅色底 */
  --on-brand:#07352a;     /* 品牌色面上的文字颜色 */
  --danger:#e5484d;       /* 未读红点 / 已删除等的警示色 */
  --text:#18191c;
  --text-2:#61666d;
  --text-3:#9499a0;
  --border:#e3e5e7;
  --radius:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  padding-top:60px;               /* 给固定导航栏让位 */
  background:#fff;
  color:var(--text);
  font-size:14px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
}
a{color:inherit;text-decoration:none;}
img{display:block;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}
.container{width:1200px;margin:0 auto;}

/* ==================== 顶部导航栏 ==================== */
.nav{
  position:fixed;top:0;left:0;right:0;height:60px;z-index:100;
  background:#fff;border-bottom:1px solid var(--border);
  box-shadow:0 1px 6px rgba(0,0,0,.03);
}
.nav-inner{width:1200px;height:60px;margin:0 auto;display:flex;align-items:center;gap:18px;}
.logo{font-size:24px;font-weight:800;color:var(--brand-ink);letter-spacing:-.5px;flex:none;}
.logo:hover{color:var(--brand-hover);}
.nav-links{display:flex;align-items:center;gap:18px;flex:none;}
.nav-links a{color:var(--text-2);font-size:14px;padding:4px 0;border-bottom:2px solid transparent;}
.nav-links a:hover,.nav-links a.active{color:var(--brand-ink);border-bottom-color:var(--brand-ink);}

/* 分区：不可点击的功能栏，仅作展示 */
.nav-section-wrap{display:flex;align-items:center;gap:8px;flex:none;}
.nav-section{font-size:14px;color:var(--text-2);cursor:default;user-select:none;}
/* 子分区：灰底圆框包住整组，体现它是「分区」的子集 */
.section-chips{
  display:flex;align-items:center;gap:10px;flex:none;
  padding:4px 12px;background:#f2f3f5;border:1px solid #e8eaed;border-radius:999px;
}
.section-chip{font-size:12px;color:var(--text-2);cursor:default;user-select:none;white-space:nowrap;}

/* 上传作品：与同级功能栏字体不同，更醒目（也仅做 UI 展示） */
.nav-upload{
  display:inline-flex;align-items:center;gap:3px;
  height:32px;padding:0 15px;border:none;border-radius:16px;
  background:linear-gradient(135deg,#65e2a6,#33c98b);
  color:var(--on-brand);
  font-size:15px;font-weight:800;letter-spacing:.6px;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  box-shadow:0 2px 10px rgba(101,226,166,.55);
  transition:transform .15s,box-shadow .2s;
}
.nav-upload:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(101,226,166,.8);}
.nav-upload .plus{font-size:16px;font-weight:800;margin-top:-2px;}

/* 账号区（其后是最右侧搜索框） */
.nav-right{margin-left:auto;display:flex;align-items:center;gap:16px;flex:none;}

.search-box{position:relative;flex:none;width:250px;}.search-box input{
  width:100%;height:38px;padding:0 46px 0 14px;font-size:14px;outline:none;
  background:#f6f7f8;border:1px solid var(--border);border-radius:var(--radius);transition:.2s;
}
.search-box input:focus{background:#fff;border-color:var(--brand-ink);}
.search-box button{
  position:absolute;right:5px;top:5px;width:32px;height:28px;border:none;border-radius:6px;
  background:transparent;font-size:15px;color:var(--text-2);
}
.search-box button:hover{color:var(--brand-ink);}

.nav-right{margin-left:auto;display:flex;align-items:center;gap:18px;flex:none;}
/* 页面编号：pageId / TOTAL_PAGES（显示在页脚） */
.page-counter{
  display:inline-block;
  font-size:12px;
  color:var(--text-3);
  white-space:nowrap;
}
.msg-icon{position:relative;font-size:19px;color:var(--text-2);line-height:1;}
.msg-icon:hover{color:var(--brand-ink);}
.badge{
  position:absolute;top:-6px;right:-10px;background:var(--danger);color:#fff;
  font-size:11px;line-height:15px;padding:0 5px;border-radius:9px;
}
.user-area{position:relative;}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:20px;
  cursor:pointer;transition:.2s;
}
.user-chip:hover{background:#f6f7f8;}
.dropdown{
  position:absolute;right:0;top:44px;min-width:150px;padding:6px;display:none;
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 6px 20px rgba(0,0,0,.1);
}
.dropdown.open{display:block;}
.dropdown a,.dropdown-item{display:block;padding:8px 12px;border-radius:6px;font-size:13px;}
.dropdown a:hover,.dropdown-item:hover{background:var(--brand-soft);color:var(--brand-ink);}
.dropdown-item{cursor:pointer;}

.btn-primary{
  display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 18px;
  background:var(--brand);color:var(--on-brand);font-weight:500;border:none;border-radius:var(--radius);font-size:14px;
  flex:none;white-space:nowrap;   /* 作为 flex 子项时不被压缩，文字始终保持横排 */
}
.btn-primary:hover{background:var(--brand-hover);}

/* ==================== 首页广告位（不可点击，固定框内轮换） ==================== */
.ad-frame{
  position:relative;width:100%;height:300px;margin:18px 0 24px;
  border-radius:12px;overflow:hidden;background:#e9ebee;
  cursor:default;user-select:none;      /* 纯展示：无任何点击交互 */
}
.ad-slide{
  position:absolute;inset:0;opacity:0;transition:opacity .6s ease;
  background-size:cover;background-position:center;
  display:flex;align-items:center;
}
.ad-slide.on{opacity:1;}
/* 左侧压暗，保证广告文案可读 */
.ad-slide::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.66),rgba(0,0,0,.18) 64%,rgba(0,0,0,0));
}
.ad-text{position:relative;z-index:1;padding:0 78px;color:#fff;}
.ad-title{font-size:32px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 12px rgba(0,0,0,.35);}
.ad-sub{margin-top:12px;font-size:16px;opacity:.92;}
.ad-flag{
  position:absolute;right:12px;top:12px;z-index:2;padding:2px 8px;border-radius:4px;
  background:rgba(0,0,0,.42);color:#fff;font-size:12px;
}
.ad-dots{position:absolute;left:78px;bottom:20px;z-index:2;display:flex;gap:7px;}
.ad-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);transition:.25s;}
.ad-dot.on{width:20px;background:#fff;border-radius:4px;}
/* 左右切换箭头：广告唯一的可交互部分 */
.ad-nav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:2;
  width:38px;height:38px;padding-bottom:3px;border:none;border-radius:50%;
  background:rgba(0,0,0,.38);color:#fff;font-size:22px;line-height:1;
  transition:background .18s,color .18s;
}
.ad-nav:hover{background:var(--brand);color:var(--on-brand);}
.ad-nav.prev{left:16px;}
.ad-nav.next{right:16px;}

/* ==================== 通用元素 ==================== */
.avatar-xs{width:22px;height:22px;border-radius:50%;object-fit:cover;background:#eee;flex:none;}
.avatar-sm{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#eee;flex:none;}
.avatar-md{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#eee;flex:none;}
.page-head{display:flex;align-items:baseline;gap:12px;margin:24px 0 16px;}
.page-title{margin:0;font-size:22px;font-weight:600;}
.page-sub{font-size:13px;color:var(--text-3);}
.empty{
  padding:70px 0;text-align:center;color:var(--text-3);font-size:14px;
}
.empty .empty-title{font-size:18px;color:var(--text-2);margin-bottom:10px;}
.card{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.03);
}
.v-tag{
  padding:1px 7px;border-radius:4px;font-size:12px;
  background:var(--brand-soft);color:var(--brand-ink);
}

/* ==================== 内容卡片网格（视频 + 图文通用） ==================== */
.post-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 20px;}
.post-card{display:block;border-radius:10px;}
.cover-wrap{
  position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--radius);
  overflow:hidden;background:#e3e5e7;
}
.cover{width:100%;height:100%;object-fit:cover;transition:transform .35s;}
.post-card:hover .cover{transform:scale(1.06);}
.duration{
  position:absolute;right:6px;bottom:6px;padding:1px 5px;border-radius:4px;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;
}
.cover-stats{
  position:absolute;left:7px;bottom:6px;display:flex;gap:10px;
  color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6);
}
/* 内容类型角标：视频为半透明黑，图文为品牌绿 */
.type-badge{
  position:absolute;left:6px;top:6px;padding:1px 7px;border-radius:4px;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;
}
.type-badge.note{background:var(--brand);color:var(--on-brand);}
.p-title{
  margin:9px 0 7px;height:40px;font-size:14px;line-height:20px;font-weight:500;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.post-card:hover .p-title{color:var(--brand-ink);}
.p-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);}
.p-up{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

/* ==================== 分页器 ==================== */
.pager{display:flex;justify-content:center;gap:8px;margin:34px 0 12px;}
.page-btn{
  min-width:34px;height:34px;padding:0 10px;font-size:13px;
  background:#fff;border:1px solid var(--border);border-radius:6px;color:var(--text-2);
}
.page-btn:hover:not(:disabled){border-color:var(--brand-ink);color:var(--brand-ink);}
.page-btn.active{background:var(--brand);border-color:var(--brand);color:var(--on-brand);}
.page-btn:disabled{opacity:.45;cursor:not-allowed;}

/* ==================== 视频详情页 ==================== */
.detail-layout{display:flex;gap:20px;margin-top:20px;}
.detail-main{width:820px;flex:none;}
.detail-side{flex:1;min-width:0;}
.player{
  position:relative;width:100%;aspect-ratio:16/9;background:#000;
  border-radius:10px;overflow:hidden;cursor:pointer;
}
.player img{width:100%;height:100%;object-fit:cover;opacity:.6;}
.play-btn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:76px;height:76px;padding-left:6px;border:none;border-radius:50%;
  background:rgba(101,226,166,.95);color:var(--on-brand);font-size:28px;line-height:1;
  box-shadow:0 6px 24px rgba(0,0,0,.35);transition:.2s;
}
.play-btn:hover{background:var(--brand-hover);transform:translate(-50%,-50%) scale(1.06);}

/* 图文帖：多图画廊 */
.gallery-stage{
  position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;
  overflow:hidden;background:#f1f2f3;
}
.gallery-stage img{width:100%;height:100%;object-fit:cover;}
.gallery-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;
  border:none;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:22px;line-height:1;
}
.gallery-nav:hover{background:var(--brand);color:var(--on-brand);}
.gallery-nav.prev{left:12px;}
.gallery-nav.next{right:12px;}
.gallery-index{
  position:absolute;right:12px;top:12px;padding:2px 10px;border-radius:12px;
  background:rgba(0,0,0,.5);color:#fff;font-size:12px;
}
.gallery-thumbs{display:flex;gap:8px;margin-top:10px;}
.thumb{
  width:88px;height:56px;padding:0;border:2px solid transparent;border-radius:6px;
  overflow:hidden;background:none;
}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb.active{border-color:var(--brand-ink);}

/* 图文帖：正文与数据 */
.note-text{
  padding:18px 20px 6px;font-size:14px;line-height:24px;color:var(--text-2);
  white-space:pre-line;
}
.note-stats{
  display:flex;gap:20px;padding:12px 20px 16px;font-size:13px;
  color:var(--text-3);border-top:1px solid #f6f7f8;margin-top:10px;
}
.post-title{margin:18px 0 10px;font-size:20px;line-height:28px;font-weight:600;}
/* 已删除作品的标题已清空，隐藏空标题占位，避免留下空白块 */
.post-title:empty,.p-title:empty{display:none;}
.video-sub{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text-3);flex-wrap:wrap;}
.up-panel{padding:16px;}
.up-panel-top{display:flex;align-items:center;gap:12px;}
.up-panel-top.is-static{cursor:default;}
.up-name-lg{font-size:15px;font-weight:600;}
.up-sign{font-size:12px;color:var(--text-3);margin-top:4px;}
.up-fans{font-size:12px;color:var(--text-3);margin-top:2px;}
/* （「相关推荐」模块已按需求移除） */

/* 评论区 */
.comment-card{margin-top:18px;padding:18px 20px;}
.comment-head{font-size:16px;font-weight:600;margin-bottom:6px;}
.comment-form{display:flex;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid #f1f2f3;}
/* 输入框占用剩余空间，保证右侧「发布」按钮不被挤压（文字保持横排） */
.comment-form .input{flex:1;width:auto;min-width:0;}
.comment-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #f6f7f8;}
.comment-item:last-child{border-bottom:none;}
/* 评论 / 回复头像：可点击跳转到该用户的个人界面 */
.avatar-link{display:block;flex:none;align-self:flex-start;border-radius:50%;line-height:0;transition:box-shadow .18s;}
.avatar-link:hover{box-shadow:0 0 0 2px var(--brand);}
/* 评论 / 回复昵称：同样可点击跳转到该用户的个人界面 */
.name-link{color:inherit;transition:color .18s;}
.name-link:hover{color:var(--brand-ink);text-decoration:underline;}
/* 假账号（氛围账号）的个人空间不开放：评论区里的头像 / 昵称渲染为纯文本 */
.avatar-link.is-static,.name-link.is-static{cursor:default;}
.avatar-link.is-static:hover{box-shadow:none;}
.name-link.is-static:hover{color:inherit;text-decoration:none;}
.comment-name{font-size:13px;color:var(--text-2);font-weight:500;}
.comment-text{font-size:14px;line-height:21px;margin:4px 0;}
.comment-time{font-size:12px;color:var(--text-3);}
/* 评论 / 回复正文里的链接：品牌绿 + 下划线，换行时按字符断开避免长链接撑破布局 */
.text-link{color:var(--brand-ink);text-decoration:underline;word-break:break-all;}
.text-link:hover{color:var(--brand);}
.input{
  width:100%;height:40px;padding:0 12px;font-size:14px;outline:none;
  border:1px solid var(--border);border-radius:var(--radius);transition:.2s;
}
.input:focus{border-color:var(--brand-ink);box-shadow:0 0 0 3px rgba(101,226,166,.28);}

/* ==================== 登录页 ==================== */
.login-wrap{display:flex;justify-content:center;margin-top:56px;}
.login-card{width:410px;padding:34px 32px;}
.login-title{margin:0 0 6px;font-size:22px;font-weight:600;text-align:center;}
.login-sub{margin:0 0 24px;font-size:13px;color:var(--text-3);text-align:center;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;}
/* 输入框下方的固定提示（placeholder 输入后会消失，这里常驻） */
.field-hint{margin-top:6px;font-size:12px;color:var(--text-3);}
.field-hint b{color:var(--brand-ink);font-weight:600;}
.tip-accounts{
  margin-top:18px;padding:12px 14px;font-size:13px;line-height:22px;color:var(--text-2);
  background:#fafbfc;border:1px dashed var(--border);border-radius:var(--radius);
}
.tip-accounts b{color:var(--brand-ink);}

/* ==================== 用户主页 ==================== */
/* ==================== 个人空间：固定背景图头部 ==================== */
.space-header{position:relative;margin-top:20px;overflow:hidden;padding:0;}
/* 背景图固定不可更改：仅展示，无任何更换入口与交互 */
.space-cover{
  height:170px;background-size:cover;background-position:center;
  background-color:#dfe3e7;position:relative;cursor:default;user-select:none;
}
.space-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.34));
}
.space-banner{display:flex;align-items:flex-start;gap:18px;padding:0 28px 24px;position:relative;}
.space-banner .avatar-lg{
  width:96px;height:96px;margin-top:-48px;border:4px solid #fff;border-radius:50%;
  object-fit:cover;background:#eee;flex:none;box-shadow:0 4px 14px rgba(0,0,0,.14);
}
.space-banner-info{padding-top:14px;min-width:0;}

/* 他人主页右上角的「关注」按钮：仅展示，不可交互（不加 data-action，也不会触发任何逻辑） */
.space-banner .btn-follow{margin-left:auto;margin-top:14px;flex:none;}
.btn-follow{
  height:34px;padding:0 18px;border:1px solid transparent;border-radius:17px;
  background:var(--brand);color:var(--on-brand);font-size:14px;font-weight:500;
  cursor:default;white-space:nowrap;
}
.btn-follow.following{background:#f2f3f5;border-color:var(--border);color:var(--text-2);}
.btn-follow[disabled]{opacity:1;}   /* 覆盖浏览器对 disabled 控件的默认置灰 */

/* ==================== 用户主页 banner ==================== */
.user-banner{display:flex;align-items:center;gap:18px;padding:26px 28px;margin-top:20px;}
.user-banner .avatar-lg{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#eee;flex:none;}
.user-nick{font-size:22px;font-weight:600;}
.user-sign{font-size:13px;color:var(--text-3);margin-top:8px;}
.user-counts{font-size:13px;color:var(--text-2);margin-top:10px;display:flex;align-items:center;gap:18px;}

/* 个人空间：可点击的「关注 N 人」 + 关注列表 */
.stat-link{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 11px;border:1px solid var(--border);border-radius:14px;
  background:#fff;color:var(--text-2);font-size:13px;transition:.18s;
}
.stat-link:hover{border-color:var(--brand-ink);color:var(--brand-ink);}
.stat-link.active{background:var(--brand-soft);border-color:var(--brand-ink);color:var(--brand-ink);font-weight:600;}
.stat-link .caret{font-size:10px;}
.follow-panel{margin-top:16px;padding:16px 18px 18px;}
.follow-panel-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin-bottom:14px;
}
.follow-panel-title{font-size:15px;font-weight:600;}
.follow-panel-hint{font-size:12px;color:var(--text-3);}
.follow-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.follow-item{
  display:flex;align-items:center;gap:10px;padding:11px 13px;
  border:1px solid var(--border);border-radius:10px;transition:.18s;
}
.follow-item:hover{border-color:var(--brand-ink);background:#fafbfc;}
.follow-item:hover .follow-name{color:var(--brand-ink);}
.follow-item:hover .follow-go{color:var(--brand-ink);}
.follow-name{font-size:14px;font-weight:500;}
.follow-sub{font-size:12px;color:var(--text-3);margin-top:3px;}
.follow-go{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap;}

/* ==================== 私信页 ==================== */
.msg-layout{
  display:flex;height:600px;margin-top:20px;overflow:hidden;
  background:#fff;border:1px solid var(--border);border-radius:10px;
}
.contact-list{width:232px;flex:none;overflow-y:auto;border-right:1px solid var(--border);}
.contact{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;
  background:#fff;border:none;border-bottom:1px solid #f6f7f8;text-align:left;
}
.contact:hover{background:#fafbfc;}
.contact.active{background:var(--brand-soft);}
.contact-name{font-size:14px;font-weight:500;}
.contact-last{
  font-size:12px;color:var(--text-3);margin-top:3px;max-width:150px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
/* 联系人未读数红点：显示该会话的未读消息数量 */
.contact-badge{
  flex:none;margin-left:auto;min-width:17px;height:17px;padding:0 5px;
  background:var(--danger);color:#fff;border-radius:9px;
  font-size:11px;line-height:17px;text-align:center;font-weight:600;
}
.chat-panel{flex:1;display:flex;flex-direction:column;min-width:0;}
.chat-head{padding:14px 18px;font-size:15px;font-weight:600;border-bottom:1px solid var(--border);}
.chat-body{
  flex:1;overflow-y:auto;padding:18px;background:#fafbfc;
  display:flex;flex-direction:column;gap:14px;
}
.bubble-row{display:flex;gap:10px;align-items:flex-start;}
.bubble-row.mine{flex-direction:row-reverse;}
.bubble{
  max-width:60%;padding:9px 13px;font-size:14px;line-height:20px;
  background:#fff;border:1px solid var(--border);border-radius:10px;
}
.bubble-row.mine .bubble{background:var(--brand);border-color:var(--brand);color:var(--on-brand);}
.bubble-time{font-size:11px;color:var(--text-3);align-self:flex-end;padding-bottom:4px;white-space:nowrap;}
/* 私信消息的已读 / 未读标签（仅收到的消息显示）
 * 未读：可点击，立即标为已读；已读：不可逆，不能再改回未读 */
.msg-state{
  align-self:flex-end;margin-bottom:2px;
  padding:1px 8px;border:1px solid transparent;border-radius:10px;
  font-size:12px;line-height:16px;white-space:nowrap;transition:.15s;
}
.msg-state.unread{background:#ffe9ee;border-color:#ffd3dc;color:#e5484d;font-weight:600;cursor:pointer;}
.msg-state.unread:hover{border-color:var(--brand-ink);color:var(--brand-ink);}
.msg-state.read{background:#f2f3f5;border-color:#e8eaed;color:var(--text-3);cursor:default;}
.chat-foot{display:flex;gap:10px;padding:12px;border-top:1px solid var(--border);}
.chat-foot input{flex:1;height:38px;}

/* ==================== 作品状态角标 ==================== */
/* 状态角标：需要压在任意封面图上，统一用高对比处理（实色 + 白描边 + 投影） */
.status-badge{
  position:absolute;right:6px;top:6px;
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 9px;border-radius:11px;
  font-size:12px;font-weight:700;letter-spacing:.5px;color:#fff;
  border:1.5px solid rgba(255,255,255,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
/* 私密：高饱和琥珀渐变 + 锁图标，比原来的半透明黑更醒目，且不与「已删除」的红色混淆
   用深色文字/图标而非白色——白字在琥珀底上对比度仅 ~1.8，深色可达 7:1 以上 */
.status-badge.private{
  background:linear-gradient(135deg,#ffc247,#f0810f);
  color:#3d2400;
}
.status-badge.private::before{
  content:'🔒';font-size:11px;line-height:1;
  filter:brightness(0) opacity(.78);   /* 压成深色锁形，在琥珀底上清晰可辨 */
}
.status-badge.deleted{background:#e5484d;}
/* 已删除的作品：封面置灰，标题降级显示 */
/* 已删除作品：灰色「不可见」占位画面 */
.deleted-media{
  width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;
  background:#eceef1;border:1px solid #e3e5e7;
}
.deleted-media img{width:100%;height:100%;object-fit:cover;}
.post-card.is-deleted .p-title{color:var(--text-3);}
.post-card.is-deleted:hover .p-title{color:var(--text-3);}

/* 假账号（演示用氛围账号）的作品：卡片可见但整张不可点击 */
.post-card.is-locked{cursor:default;}
.post-card.is-locked:hover .cover{transform:none;}
.post-card.is-locked:hover .p-title{color:var(--text);}
.status-badge.locked{background:#6b7280;}

/* ==================== 作品操作条（赞 / 踩 可交互，收藏 / 转发 仅展示） ==================== */
.action-bar{display:flex;align-items:center;gap:12px;margin:14px 0 6px;flex-wrap:wrap;}
.action-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border:1px solid var(--border);border-radius:18px;
  background:#fff;color:var(--text-2);font-size:14px;transition:.18s;
}
.action-btn:hover{border-color:var(--brand-ink);color:var(--brand-ink);}
.action-btn.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);font-weight:600;}
.action-static{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 16px;border:1px dashed var(--border);border-radius:18px;
  color:var(--text-3);font-size:14px;cursor:default;
}

/* ==================== 评论区 ==================== */
.owner-bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 14px;margin-bottom:12px;background:var(--brand-soft);
  border-radius:8px;font-size:13px;color:var(--brand-ink);
}
.switch{position:relative;width:44px;height:24px;flex:none;border:none;border-radius:12px;background:#d0d3d6;transition:.2s;}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;}
.switch.on{background:var(--brand);}
.switch.on::after{left:23px;}
.comments-closed{padding:34px 0;text-align:center;font-size:14px;color:var(--text-3);}
.comments-closed b{display:block;font-size:16px;color:var(--text-2);margin-bottom:8px;font-weight:600;}

.comment-actions{display:flex;align-items:center;gap:16px;margin-top:7px;font-size:12px;}
.c-act{
  display:inline-flex;align-items:center;gap:4px;padding:0;border:none;
  background:none;font-size:12px;color:var(--text-3);transition:.15s;
}
.c-act:hover{color:var(--brand-ink);}
.c-act.active{color:var(--brand-ink);font-weight:600;}
.author-liked{
  display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:4px;
  background:var(--brand-soft);color:var(--brand-ink);font-size:12px;
}
/* 点赞 / 踩图标：用 SVG 才能换颜色（emoji 是彩色字形，改不了）
 * 未点亮 = 白色填充 + 灰色描边；点亮后 = 品牌绿填充 */
.thumb{
  width:15px;height:15px;flex:none;
  fill:#fff;stroke:var(--text-3);stroke-width:1.4;stroke-linejoin:round;
  transition:fill .18s,stroke .18s;
}
.action-btn .thumb{width:16px;height:16px;}
.c-act:hover .thumb,.action-btn:hover .thumb{stroke:var(--brand-ink);}
.c-act.active .thumb,.action-btn.active .thumb{fill:var(--brand);stroke:var(--brand);}
/* 回复区：直接展示回复内容，白底 + 品牌色竖线与评论本体区分开，视觉上更醒目 */
.reply-list{
  margin-top:11px;padding:11px 13px;border-radius:8px;
  background:#fff;border:1px solid var(--border);border-left:3px solid var(--brand);
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.reply-item{display:flex;gap:9px;align-items:flex-start;}
.reply-item + .reply-item{margin-top:11px;padding-top:11px;border-top:1px dashed #cdeadf;}
/* 「谁回复谁」：昵称字体与评论区昵称保持一致（13px / 500 / --text-2）
 * 回复者与被回复者都用同一字号字重字色，靠中间的「回复」胶囊区分 */
.reply-who{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  font-size:13px;font-weight:500;color:var(--text-2);
}
.reply-arrow{
  display:inline-flex;align-items:center;padding:0 5px;border-radius:8px;
  background:#eef0f2;color:var(--text);font-size:11px;font-weight:600;
}
.reply-text{font-size:13px;line-height:20px;color:var(--text);margin-top:4px;}
.reply-meta{font-size:12px;color:var(--text-3);margin-top:3px;}
/* 回复条数 ≥2 时折叠，只留第一条 + 展开按钮
 * 按钮底色用浅品牌色：回复区本身已是白底，纯白按钮会看不见 */
.reply-toggle{
  display:inline-flex;align-items:center;gap:5px;margin-top:11px;padding:3px 9px;
  border:none;border-radius:12px;background:var(--brand-soft);font-size:12px;font-weight:600;
  color:var(--brand-ink);
}
.reply-toggle:hover{background:var(--brand);color:var(--on-brand);}
.reply-more{font-weight:400;color:var(--text-3);}
.reply-toggle:hover .reply-more{color:rgba(7,53,42,.75);}

/* 假账号出现在关注列表里时：不开放主页，渲染成不可点击的静态项 */
.follow-item.is-static{cursor:default;}
.follow-item.is-static:hover{border-color:#eceef1;}

/* ==================== 动态页：小红书式卡片流 ==================== */
/* 4 列网格：时间从新到旧，先排满一行，再排下一行，同行内从左到右 */
.xhs-feed{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px 16px;align-items:start;
}
.xhs-card{display:flex;flex-direction:column;min-width:0;}
/* 假账号（氛围账号）的作品：整张卡片不可点击 */
.xhs-card.is-locked{cursor:default;}
.xhs-card.is-locked:hover .xhs-cover img{transform:none;}
.xhs-card.is-locked:hover .xhs-title{color:var(--text);}
.xhs-cover{
  position:relative;display:block;width:100%;aspect-ratio:4 / 5;
  border-radius:10px;overflow:hidden;background:#e9ebee;
}
.xhs-cover img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s;}
.xhs-card:hover .xhs-cover img{transform:scale(1.04);}
/* 发布时间压在图片左下角，与右下角的时长对称 */
.xhs-time{
  position:absolute;left:6px;bottom:6px;padding:1px 6px;border-radius:4px;
  background:rgba(0,0,0,.55);color:#fff;font-size:12px;
}
.xhs-title{
  margin:9px 2px 0;font-size:13px;line-height:19px;font-weight:500;color:var(--text);
  height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.xhs-title:hover{color:var(--brand-ink);}
.xhs-foot{display:flex;align-items:center;gap:6px;margin:8px 2px 0;font-size:12px;color:var(--text-3);}
.xhs-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.xhs-like{flex:none;margin-left:auto;}

/* ==================== 创作者中心：浏览趋势折线图 ==================== */
.chart-card{padding:18px 20px 14px;margin-bottom:18px;}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;}
.chart-title{font-size:16px;font-weight:600;}
.chart-sub{font-size:12px;color:var(--text-3);margin-top:6px;}
.chart-nav{display:flex;align-items:center;gap:10px;flex:none;}
.chart-pos{font-size:12px;color:var(--text-3);min-width:52px;text-align:center;}
.chart-btn{
  width:32px;height:32px;padding-bottom:2px;border:1px solid var(--border);border-radius:50%;
  background:#fff;color:var(--text-2);font-size:17px;line-height:1;transition:.18s;
}
.chart-btn:hover{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink);}
.chart-svg{display:block;width:100%;height:auto;}
.chart-note{font-size:12px;color:var(--text-3);margin-top:6px;}

/* ==================== 个人空间 ==================== */
.tabs{display:flex;gap:6px;margin:20px 0 18px;border-bottom:1px solid var(--border);}
.tab{
  padding:10px 18px;margin-bottom:-1px;border:none;border-bottom:2px solid transparent;
  background:none;font-size:15px;color:var(--text-2);
}
.tab:hover{color:var(--brand-ink);}
.tab.active{color:var(--brand-ink);font-weight:600;border-bottom-color:var(--brand-ink);}
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{padding:16px 18px;background:#fff;border:1px solid var(--border);border-radius:10px;}
.stat-num{font-size:24px;font-weight:700;color:var(--brand-ink);line-height:1;}
.stat-label{font-size:12px;color:var(--text-3);margin-top:8px;}
.data-table{width:100%;border-collapse:collapse;font-size:13px;}.data-table th,.data-table td{padding:12px;text-align:left;border-bottom:1px solid #f1f2f3;white-space:nowrap;}
.data-table th{background:#fafbfc;color:var(--text-3);font-weight:500;}
.data-table td{color:var(--text-2);}
.data-table td.strong{color:var(--text);font-weight:600;}
.table-note{font-size:12px;color:var(--text-3);margin-top:12px;}

/* ==================== 弹窗 ==================== */
.modal-mask{
  position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.45);
}
.modal-mask.open{display:flex;}
.modal{
  width:380px;padding:26px 26px 22px;background:#fff;border-radius:12px;text-align:center;
  box-shadow:0 14px 44px rgba(0,0,0,.22);
}
.modal-icon{font-size:38px;line-height:1;margin-bottom:12px;}
.modal-title{font-size:18px;font-weight:600;margin-bottom:8px;}
.modal-body{font-size:14px;color:var(--text-2);line-height:22px;margin-bottom:20px;}

/* ==================== 页脚 & 提示条 ==================== */
.footer{
  width:1200px;margin:40px auto 0;padding:22px 0 40px;border-top:1px solid var(--border);
  font-size:12px;color:var(--text-3);text-align:center;line-height:22px;
}
.toast{
  position:fixed;left:50%;top:80px;z-index:999;padding:10px 20px;border-radius:var(--radius);
  background:rgba(0,0,0,.78);color:#fff;font-size:14px;opacity:0;pointer-events:none;
  transform:translate(-50%,-12px);transition:.25s;
}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* ==================== 收到新消息的提示条（屏幕顶部，条状） ==================== */
/* 层级：页面内容 < 提示条(90) < 导航栏及其下拉菜单(100) < 通用弹窗(200) < 轻提示(999)
 * 提示条放在导航栏之下，保证「账号下拉菜单」等导航内元素始终盖在提示条之上可点击；
 * 外层 pointer-events:none，只有提示条本身可点击 —— 不遮罩、不抢焦点，
 * 页面其它功能照常可用；提示条会自动滑走（也可手动关闭）。 */
.msgbar-wrap{
  position:fixed;left:0;right:0;top:60px;z-index:90;
  pointer-events:none;overflow:hidden;
}
.msgbar{
  height:48px;padding:0 24px;background:var(--brand-soft);
  border-bottom:1px solid #cdf0e0;box-shadow:0 6px 16px rgba(0,0,0,.08);
  pointer-events:auto;cursor:pointer;
  transform:translateY(-100%);transition:transform .26s;
}
.msgbar.in{transform:translateY(0);}
.msgbar-inner{
  width:1200px;margin:0 auto;height:100%;
  display:flex;align-items:center;gap:10px;min-width:0;
}
.msgbar-icon{flex:none;font-size:15px;line-height:1;color:var(--brand-ink);}
.msgbar-name{flex:none;font-size:13px;font-weight:600;color:var(--text);}
.msgbar-badge{
  flex:none;padding:0 6px;border-radius:8px;font-size:11px;line-height:16px;font-weight:600;
  background:var(--brand);color:var(--on-brand);
}
.msgbar-text{
  flex:1;min-width:0;font-size:13px;color:var(--text-2);
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
.msgbar-queue{flex:none;font-size:12px;color:var(--brand-ink);}
.msgbar .btn-primary{height:30px;padding:0 14px;font-size:13px;}
.msgbar-close{
  flex:none;width:26px;height:26px;border:none;border-radius:6px;background:none;
  font-size:16px;line-height:1;color:var(--text-2);
}
.msgbar-close:hover{background:#fff;color:var(--text);}
</style>

<body>

<!-- ==================== 顶部固定导航栏 ==================== -->
<header class="nav">
  <div class="nav-inner">

    <a class="logo" href="#/home">噼里啪啦</a>

<!-- ==================== 主内容区（由 JS 渲染） ==================== -->
<main class="container" id="app"></main>

<div class="footer">

  仅适配电脑端 · 同时支持视频与图文帖 · 使用原生 HTML + CSS + JavaScript 编写<br>

  <span id="pageCounter" class="page-counter"></span>
</div>

<div class="toast" id="toast"></div>

<!-- 收到新消息的提示条（屏幕顶部，内容由 JS 填充） -->
<div class="msgbar-wrap" id="msgBarWrap" aria-hidden="true">

<!-- 通用弹窗（上传作品等仅展示 UI 的功能） -->

// 公开作品所有人可见；私密 / 已删除仅作者本人可见
function canViewPost(p, viewer) {
  if (!p) return false;
  if (p.visibility === 'public') return true;
  return !!(viewer && viewer.username === p.up);
}
// 当前身份可浏览的作品列表
function visiblePosts(viewer) {
  return POSTS.filter(function (p) { return canViewPost(p, viewer); });

  return POSTS.filter(function (p) { return p.visibility === 'public'; });

// 是否作者本人
function isOwner(p, viewer) {
  return !!(p && viewer && p.up === viewer.username);
}

  try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
}
function saveCurrentUsername(username) {
  try {
    if (username) localStorage.setItem(STORAGE_KEY, username);
    else localStorage.removeItem(STORAGE_KEY);
  } catch (e) { /* 隐私模式下忽略 */ }
}
function currentUser() {
  var name = loadCurrentUsername();
  if (!name) return null;
  return USERS.filter(function (u) { return u.username === name; })[0] || null;
}

/* ---- 2.2 数据查询工具 ---- */
function getUser(username) {
  var u = USERS.filter(function (x) { return x.username === username; })[0];
  if (u) return u;
  // 氛围账号（不可登录）也要能解析出昵称 / 头像 / 签名
  return EXTRA_USERS.filter(function (x) { return x.username === username; })[0] || null;
}
function getPost(id) {
  return POSTS.filter(function (p) { return String(p.id) === String(id); })[0] || null;
}
function worksOf(username) {
  return POSTS.filter(function (p) { return p.up === username; });
}
function nickOf(username) {
  var u = getUser(username);
  return u ? u.nickname : username;
}
function avatarOf(username) {
  var u = getUser(username);
  return u ? u.avatar : PLACEHOLDER_AVATAR;
}
/* 某个账号的好友（私信联系人）名单 */
function friendsOf(username) {
  return FRIENDS[username] || [];
}

/* ---- 2.2.1 评论与赞踩（交互状态只存在内存里，刷新后重置） ---- */
function commentsOf(p) {
  return p.comments || DEFAULT_COMMENTS;
}
/* ---- 视频帖的评论总数：显示成一个「看起来真实」的随机数 ----
 * 取值范围：实际展示的条数（4 条）~ 点赞数，既不低于展示条数，也不超过点赞数。
 * 每个帖子在本次页面加载内只随机一次（刷新页面才重新随机），
 * 所以切换页面、点赞、展开回复时这个数字都不会跳动。
 */
var VIDEO_COMMENT_SHOWN = 4;          // 视频帖评论区实际展示的条数
var videoCommentTotals = {};          // postId -> 该帖随机出来的评论总数

function commentTotalOf(p) {
  var actual = commentsOf(p).length;
  if (p.type !== 'video') return actual;
  if (videoCommentTotals[p.id] === undefined) {
    var shown = Math.min(actual, VIDEO_COMMENT_SHOWN);
    // 点赞数比展示条数还少时退化成展示条数，保证区间合法
    var max = Math.max(p.likes || 0, shown);
    videoCommentTotals[p.id] = shown + Math.floor(Math.random() * (max - shown + 1));
  }
  return videoCommentTotals[p.id];
}
function commentKey(postId, idx) { return postId + '|' + idx; }

// 作品赞 / 踩：基础数 + 本次会话中的交互增量
function postLikes(p) {
  return (p.likes || 0) + (state.postVote[p.id] === 'like' ? 1 : 0);
}
function postDislikes(p) {
  return (p.dislikes || 0) + (state.postVote[p.id] === 'dislike' ? 1 : 0);
}
// 评论赞 / 踩
function commentLikes(postId, idx, c) {
  return (c.likes || 0) + (state.commentVote[commentKey(postId, idx)] === 'like' ? 1 : 0);
}
function commentDislikes(postId, idx, c) {
  return (c.dislikes || 0) + (state.commentVote[commentKey(postId, idx)] === 'dislike' ? 1 : 0);
}
// 评论是否被作者点过赞（预设 + 本次会话交互）
// 评论是否被作者点过赞
// 本次会话的交互结果优先于预设值，这样作者取消点赞后「作者赞过」标签才能移除
function isAuthorLiked(postId, idx, c) {
  var k = commentKey(postId, idx);
  if (Object.prototype.hasOwnProperty.call(state.authorLiked, k)) {
    return state.authorLiked[k] === true;
  }
  return !!c.authorLiked;
}

/* ---- 2.2.2 创作者中心的流量数据：固定样例 ---- */
function trafficOf(p) {
  var t = TRAFFIC[p.id];
  if (t) return t;
  // 兜底：按播放量折算，保证任何时候都有可展示的固定数据
  return {
    exposure: p.views * 3, plays: p.views,
    likes: p.likes || 0, comments: commentTotalOf(p),
    collects: p.collects || 0, fans: 0, finish: 40, interact: 8
  };
}

/* ---- 2.3 格式化工具 ---- */
function esc(str) {
  return String(str).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
/* 正文里的 http(s) 链接渲染成可点击的同名链接
 * 先转义再替换：转义后的文本里不含 < > " '，所以不可能拼出意外的标签或属性
 */
function linkify(str) {
  // 链接在中文标点处结束（中文标点不会出现在正常 URL 里）
  return esc(str).replace(/https?:\/\/[^\s<>"'，。、；：？！（）【】《》“”‘’]+/g, function (url) {
    // 链接尾部的英文标点不算链接的一部分，留在正文里
    var m = url.match(/[.,;:!?]+$/);
    var tail = m ? m[0] : '';
    if (tail) url = url.slice(0, -tail.length);
    return '<a class="text-link" href="' + url + '" target="_blank" rel="noopener noreferrer">' +
      url + '</a>' + tail;
  });
}
function fmtNum(n) {
  if (n >= 100000000) return (n / 100000000).toFixed(1) + '亿';
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return String(n);
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }
function nowTime() {
  var d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* ---- 2.4 轻提示 ---- */
var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
}

/* ==================================================================
 * 3. 通用 HTML 片段
 * ================================================================== */

/* 内容卡片（视频 / 图文通用）
 * 假账号（氛围账号）的作品：卡片正常展示，但整张不可点击（渲染成 div，没有链接）
 */
function postCardHTML(p) {
  var isVideo = p.type === 'video';
  var badge = isVideo ? '视频' : '图文 · ' + p.images.length + ' 图';
  var stats = isVideo
    ? '<span>▶ ' + fmtNum(p.views) + '</span><span>💬 ' + fmtNum(p.danmaku) + '</span>'
    : '<span>♡ ' + fmtNum(postLikes(p)) + '</span><span>★ ' + fmtNum(p.collects) + '</span>';
  // 非公开作品（私密 / 已删除）只在作者自己的页面出现，额外标注状态
  var status = p.visibility !== 'public'
    ? '<span class="status-badge ' + p.visibility + '">' + VISIBILITY[p.visibility].label + '</span>'
    : '';
  var locked = isFakeAccount(p.up);
  if (locked) status += '<span class="status-badge locked">不可查看</span>';

  var inner =
    '<div class="cover-wrap">' +
      '<img class="cover" src="' + coverOf(p) + '" alt="' + (esc(titleOf(p)) || '内容已删除') + '" loading="lazy">' +
      '<span class="type-badge' + (isVideo ? '' : ' note') + '">' + badge + '</span>' +
      status +
      '<div class="cover-stats">' + stats + '</div>' +
      (isVideo ? '<span class="duration">' + esc(p.duration) + '</span>' : '') +
    '</div>' +
    '<h3 class="p-title">' + esc(titleOf(p)) + '</h3>' +
    '<div class="p-meta">' +
      '<img class="avatar-xs" src="' + avatarOf(p.up) + '" alt="">' +
      '<span class="p-up">' + esc(nickOf(p.up)) + '</span>' +
    '</div>';

  if (locked) {
    return '<div class="post-card is-locked" title="演示用氛围账号的作品，不可查看">' + inner + '</div>';
  }

  return '<a class="post-card' + (p.visibility === 'deleted' ? ' is-deleted' : '') +
    '" href="#/post/' + p.id + '">' + inner + '</a>';
}

/* 通用弹窗 */
function openModal(title, body, icon) {
  document.getElementById('modalIcon').textContent = icon || '🛠️';
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  document.getElementById('modalMask').classList.add('open');
}
function closeModal() {
  document.getElementById('modalMask').classList.remove('open');
}

/* 分页器：key 用于区分首页 / 搜索页 */
function pagerHTML(page, totalPages, key) {
  if (totalPages <= 1) return '';
  var btns = '';
  for (var i = 1; i <= totalPages; i++) {
    btns += '<button class="page-btn' + (i === page ? ' active' : '') +
            '" data-pager="' + key + '" data-page="' + i + '">' + i + '</button>';
  }
  return '<div class="pager">' +
      '<button class="page-btn" data-pager="' + key + '" data-page="' + (page - 1) + '"' +
        (page <= 1 ? ' disabled' : '') + '>上一页</button>' +
      btns +
      '<button class="page-btn" data-pager="' + key + '" data-page="' + (page + 1) + '"' +
        (page >= totalPages ? ' disabled' : '') + '>下一页</button>' +
    '</div>';
}

/* 空状态 */
function emptyHTML(title, sub) {
  return '<div class="empty"><div class="empty-title">' + esc(title) + '</div>' +
         '<div>' + esc(sub) + '</div></div>';
}

/* 需要登录的提示 */
function needLoginHTML(text) {
  return '<div class="card"><div class="empty">' +
    '<div class="empty-title">' + esc(text) + '</div>' +
    '<div>请先 <a href="#/login" style="color:var(--brand-ink)">登录</a> 后再查看</div>' +
  '</div></div>';
}

/* 首页广告位：固定尺寸框内轮换，整块不可点击（纯展示） */
function adBannerHTML() {
  var slides = AD_SLIDES.map(function (s, i) {
    return '<div class="ad-slide' + (i === state.adIndex ? ' on' : '') + '" ' +
        'style="background-image:url(' + s.img + ')">' +
        '<div class="ad-text">' +
          '<div class="ad-title">' + esc(s.title) + '</div>' +
          '<div class="ad-sub">' + esc(s.subtitle) + '</div>' +
        '</div>' +
      '</div>';
  }).join('');

  var dots = AD_SLIDES.map(function (s, i) {
    return '<span class="ad-dot' + (i === state.adIndex ? ' on' : '') + '"></span>';
  }).join('');

  // 除左右切换箭头外，广告主体没有任何 <a> / data-action，点击不会触发跳转或弹窗
  return '<section class="ad-frame" aria-label="广告（演示，可左右切换）">' +
    slides +
    '<span class="ad-flag">广告</span>' +
    '<button type="button" class="ad-nav prev" data-action="ad-prev" title="上一张" aria-label="上一张">‹</button>' +
    '<button type="button" class="ad-nav next" data-action="ad-next" title="下一张" aria-label="下一张">›</button>' +
    '<div class="ad-dots">' + dots + '</div>' +
  '</section>';
}

/* 只切换广告的当前帧（不整页重绘，保证淡入淡出过渡） */
function setAdSlide(index) {
  var total = AD_SLIDES.length;
  state.adIndex = ((index % total) + total) % total;

  var slides = document.querySelectorAll('.ad-frame .ad-slide');
  for (var i = 0; i < slides.length; i++) {
    slides[i].className = 'ad-slide' + (i === state.adIndex ? ' on' : '');
  }
  var dots = document.querySelectorAll('.ad-frame .ad-dot');
  for (var j = 0; j < dots.length; j++) {
    dots[j].className = 'ad-dot' + (j === state.adIndex ? ' on' : '');
  }
}

var adTimer = null;
function clearAdTimer() {
  if (adTimer) { clearInterval(adTimer); adTimer = null; }
}
function startAdTimer() {
  clearAdTimer();
  adTimer = setInterval(function () {
    if (state.routeName !== 'home') { clearAdTimer(); return; }   // 离开首页就停
    setAdSlide(state.adIndex + 1);
  }, AD_ROTATE_MS);
}

/* ==================================================================
 * 4. 页面渲染：首页
 * ================================================================== */
function renderHome() {
  // 首页只展示公开作品：私密 / 已删除的作品即使是自己的也不出现
  var list = publicPosts();
  var videoCount = list.filter(function (p) { return p.type === 'video'; }).length;
  var noteCount = list.length - videoCount;
  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (state.homePage > totalPages) state.homePage = totalPages;
  if (state.homePage < 1) state.homePage = 1;

  var start = (state.homePage - 1) * PAGE_SIZE;
  var items = list.slice(start, start + PAGE_SIZE);

  app.innerHTML =
    adBannerHTML() +
    '<div class="page-head">' +
      '<h2 class="page-title">推荐</h2>' +
      '<span class="page-sub">共 ' + list.length + ' 条内容 · ' + videoCount + ' 个视频 · ' + noteCount + ' 个图文 · 第 ' + state.homePage + '/' + totalPages + ' 页</span>' +
    '</div>' +
    (items.length
      ? '<div class="post-grid">' + items.map(postCardHTML).join('') + '</div>'
      : emptyHTML('暂时没有内容', '站内帖子都是预设的固定内容')) +
    pagerHTML(state.homePage, totalPages, 'home');

  startAdTimer();
}

/* ==================================================================
 * 5. 页面渲染：搜索结果
 * ================================================================== */
function renderSearch() {
  var q = state.searchQuery || '';
  var key = q.trim().toLowerCase();

  var me = currentUser();
  var list = visiblePosts(me).filter(function (v) {
    if (!key) return false;
    // 假账号（氛围账号）的内容不会被搜索到
    if (isFakeAccount(v.up)) return false;
    // 只按 标题 / UP 主昵称 / 正文 匹配（不匹配 UP 主用户名，也不匹配标签与类型）
    // 半封闭账号（npc03 ~ npc08）的昵称不参与匹配；标题 / 正文命中时作品照常显示
    return v.title.toLowerCase().indexOf(key) > -1 ||
           (!isSealedAccount(v.up) && nickOf(v.up).toLowerCase().indexOf(key) > -1) ||
           (v.content || '').toLowerCase().indexOf(key) > -1;
  });

  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (state.searchPage > totalPages) state.searchPage = totalPages;
  if (state.searchPage < 1) state.searchPage = 1;

  var start = (state.searchPage - 1) * PAGE_SIZE;
  var items = list.slice(start, start + PAGE_SIZE);

  app.innerHTML =
    '<div class="page-head">' +
      '<h2 class="page-title">搜索：' + esc(q) + '</h2>' +
      '<span class="page-sub">共找到 ' + list.length + ' 个结果' +
        (list.length ? ' · 第 ' + state.searchPage + '/' + totalPages + ' 页' : '') + '</span>' +
    '</div>' +
    (items.length
      ? '<div class="post-grid">' + items.map(postCardHTML).join('') + '</div>'
      : emptyHTML('没有找到相关内容', '换个关键词试试，比如「管理员」「小明」「水彩」')) +    pagerHTML(state.searchPage, totalPages, 'search');
}

/* ==================================================================
 * 6. 页面渲染：内容详情（视频 / 图文通用）
 * ================================================================== */
function renderPost(id) {
  var p = getPost(id);
  var me = currentUser();

  // 假账号（氛围账号）的作品不可查看：首页卡片也不可点击
  if (p && isFakeAccount(p.up)) {
    app.innerHTML = emptyHTML('内容不可查看', '该作品来自演示用氛围账号，仅在首页展示封面');
    return;
  }

  // 私密 / 已删除作品不允许他人访问
  if (p && !canViewPost(p, me)) {
    app.innerHTML = emptyHTML('内容不可见',
      p.visibility === 'private' ? '该作品已被作者设为私密' : '该作品已被作者删除');
    return;
  }
  if (!p) {
    app.innerHTML = emptyHTML('内容不存在', '该内容可能已被删除或链接有误');
    return;
  }

  var up = getUser(p.up);
  var isVideo = p.type === 'video';
  var owner = isOwner(p, me);

  // 视频帖 → 伪播放器；图文帖 → 多图画廊
  // 已删除的作品：画面替换为灰色「不可见」占位图（不提供播放 / 画廊交互）
  // 视频帖 → 伪播放器；图文帖 → 多图画廊
  var mediaHTML;
  if (p.visibility === 'deleted') {

      '<img src="' + DELETED_PLACEHOLDER + '" alt="内容已删除，不可见">' +
    '</div>';
  } else if (isVideo) {
    mediaHTML = '<div class="player" data-action="fake-play" title="点击试试看">' +
        '<img src="' + p.cover + '" alt="">' +
        '<button class="play-btn" type="button" data-action="fake-play">▶</button>' +
      '</div>';
  } else {
    mediaHTML = galleryHTML(p);

  var statsHTML = isVideo
    ? '<span>' + fmtNum(p.views) + ' 播放</span>' +
      '<span>' + fmtNum(p.danmaku) + ' 弹幕</span>'
    : '<span>' + fmtNum(p.views) + ' 浏览</span>';

  // 状态标签：作者本人可见自己的私密 / 已删除状态
  var statusHTML = p.visibility !== 'public'
    ? '<span class="status-badge ' + p.visibility + '" style="position:static">' + VISIBILITY[p.visibility].label + '</span>'
    : '';

  // 图文帖额外的正文与数据卡片（已删除作品的正文已清空，不渲染正文块）
  var bodyText = bodyOf(p);
  var noteHTML = isVideo ? '' :

      '<div class="note-stats">' +
        '<span>♡ ' + fmtNum(postLikes(p)) + ' 点赞</span>' +
        '<span>★ ' + fmtNum(p.collects) + ' 收藏</span>' +
        '<span>' + p.images.length + ' 张图片</span>' +
      '</div>' +
    '</div>';

  // UP 主卡片：主页开放的账号是链接（可点击进主页）；假账号 / 半封闭账号渲染成静态块
  var upClosed = isProfileClosed(p.up);
  var upPanelOpen = upClosed
    ? '<div class="up-panel-top is-static" title="该账号主页不开放">'
    : '<a class="up-panel-top" href="#/user/' + (up ? up.username : p.up) + '">';
  var upPanelClose = upClosed ? '</div>' : '</a>';

  app.innerHTML =
  '<div class="detail-layout">' +

      '<h1 class="post-title">' + esc(titleOf(p)) + '</h1>' +
      '<div class="video-sub">' +
        statsHTML +
        '<span>' + esc(p.publishTime) + ' 发布</span>' +
        '<span class="v-tag">' + (isVideo ? '视频' : '图文 · ' + p.images.length + ' 图') + '</span>' +
        statusHTML +
      '</div>' +

      actionBarHTML(p, me) +
      noteHTML +

      '<div class="card comment-card" id="commentCard">' + commentSectionHTML(p, me) + '</div>' +
    '</div>' +

    '<div class="detail-side">' +
      '<div class="card up-panel">' +
        upPanelOpen +
          '<img class="avatar-md" src="' + avatarOf(p.up) + '" alt="">' +
          '<div style="min-width:0">' +
            '<div class="up-name-lg">' + esc(nickOf(p.up)) + '</div>' +
            '<div class="up-sign">' + esc(up ? up.sign : '这位作者很神秘') + '</div>' +
            '<div class="up-fans">' + (up ? fmtNum(up.fans) : '0') + ' 粉丝 · ' + worksOf(p.up).length + ' 个作品</div>' +
          '</div>' +
        upPanelClose +
      '</div>' +
    '</div>' +
  '</div>';
}

/* 点赞 / 踩图标：内联 SVG，颜色交给 CSS（未点亮白色描边，点亮后品牌绿） */
var ICON_LIKE =
  '<svg class="thumb" viewBox="0 0 24 24" aria-hidden="true">' +
    '<rect x="3" y="11.4" width="4.2" height="9.1" rx="1"/>' +
    '<path d="M8.5 20.5V11.4l3.1-6.1a1.4 1.4 0 0 1 2.6 1.1l-1 4.6h4.5a1.9 1.9 0 0 1 1.9 2.3l-1.3 5.6a2 2 0 0 1-2 1.6H8.5Z"/>' +

var ICON_DISLIKE =
  '<svg class="thumb" viewBox="0 0 24 24" aria-hidden="true">' +
    '<rect x="3" y="3.5" width="4.2" height="9.1" rx="1"/>' +
    '<path d="M8.5 3.5v9.1l3.1 6.1a1.4 1.4 0 0 0 2.6-1.1l-1-4.6h4.5a1.9 1.9 0 0 0 1.9-2.3l-1.3-5.6a2 2 0 0 0-2-1.6H8.5Z"/>' +
  '</svg>';

/* 作品操作条：赞 / 踩 可交互；收藏 / 转发 仅展示，不可交互 */
function actionBarHTML(p, me) {
  var vote = state.postVote[p.id];
  return '<div class="action-bar">' +
    '<button type="button" class="action-btn' + (vote === 'like' ? ' active' : '') + '" ' +
      'data-action="post-like" data-post="' + p.id + '">' + ICON_LIKE + '赞 ' + fmtNum(postLikes(p)) + '</button>' +
    '<button type="button" class="action-btn' + (vote === 'dislike' ? ' active' : '') + '" ' +
      'data-action="post-dislike" data-post="' + p.id + '">' + ICON_DISLIKE + '踩 ' + fmtNum(postDislikes(p)) + '</button>' +
    '<span class="action-static" title="演示数据，不可交互">★ 收藏 ' + fmtNum(p.collects) + '</span>' +
    '<span class="action-static" title="演示数据，不可交互">↗ 转发 ' + fmtNum(p.shares) + '</span>' +
  '</div>';
}

/* 评论区整体：作者可切换开启 / 关闭 */
function commentSectionHTML(p, me) {
  var owner = isOwner(p, me);
  var list = commentsOf(p);
  // 视频帖：表头显示随机评论总数，列表只渲染前 4 条（下标与赞踩状态一一对应，不能打乱）
  var total = commentTotalOf(p);
  var shownList = p.type === 'video' ? list.slice(0, VIDEO_COMMENT_SHOWN) : list;

  var ownerBar = owner
    ? '<div class="owner-bar">' +
        '<span>你是作者，可设置本作品评论区状态</span>' +
        '<label style="display:flex;align-items:center;gap:8px;cursor:pointer">' +
          '<span>' + (p.commentsEnabled ? '评论区已开启' : '评论区已关闭') + '</span>' +
          '<button type="button" class="switch' + (p.commentsEnabled ? ' on' : '') + '" ' +
            'data-action="toggle-comments" data-post="' + p.id + '" ' +
            'title="切换评论区状态" aria-label="切换评论区状态"></button>' +
        '</label>' +
      '</div>'
    : '';

  var head = '<div class="comment-head">评论 ' + total + '</div>' + ownerBar;

  if (!p.commentsEnabled) {
    return head +
      '<div class="comments-closed"><b>评论区已关闭</b>' +
        (owner ? '你可以在上方重新开启评论区' : '作者已关闭本作品的评论区') +
      '</div>';
  }

  var form =
    '<form class="comment-form" data-form="comment">' +
      '<img class="avatar-sm" src="' + (me ? me.avatar : PLACEHOLDER_AVATAR) + '" alt="">' +
      '<input class="input" type="text" name="commentText" autocomplete="off" ' +
        'placeholder="发一条友善的评论吧（伪站不会真的发出去）">' +
      '<button class="btn-primary" type="submit">发布</button>' +
    '</form>';

  var items = shownList.map(function (c, i) { return commentItemHTML(p, c, i, me); }).join('');

  return head + form + '<div>' + items + '</div>';
}

/* 评论区作者的头像 / 昵称
 * 开放主页的账号可点击进入其主页；假账号与半封闭账号（npc03 ~ npc08）主页不开放，渲染为纯文本
 */
function commentAuthorHTML(who, avatarCls) {
  var name = esc(nickOf(who));
  var avatar = '<img class="' + avatarCls + '" src="' + avatarOf(who) + '" alt="">';
  if (isProfileClosed(who)) {
    var tip = isFakeAccount(who) ? '演示用氛围账号，主页不开放' : '该账号主页不开放';
    return {
      avatar: '<span class="avatar-link is-static" title="' + tip + '">' + avatar + '</span>',
      name: '<span class="name-link is-static" title="' + tip + '">' + name + '</span>'
    };
  }
  var href = '#/user/' + esc(who);
  return {
    avatar: '<a class="avatar-link" href="' + href + '" title="进入 ' + name + ' 的主页">' + avatar + '</a>',
    name: '<a class="name-link" href="' + href + '" title="进入 ' + name + ' 的主页">' + name + '</a>'
  };
}

/* 回复条数达到该值时默认折叠（只显示第一条，其余需展开） */
var REPLY_FOLD_AT = 2;

/* 回复区：直接展示回复内容，并标出「谁回复谁」
 * - 回复数 < REPLY_FOLD_AT：全部直接显示
 * - 回复数 >= REPLY_FOLD_AT：默认折叠，只显示第一条 + 「展开其余 N 条回复」
 */
function replyListHTML(p, c, idx) {
  var replies = c.replies || [];
  if (!replies.length) return '';

  var key = commentKey(p.id, idx);
  var foldable = replies.length >= REPLY_FOLD_AT;
  var expanded = !foldable || !!state.showReplies[key];
  var shown = expanded ? replies : replies.slice(0, 1);

  var items = shown.map(function (r) {
    // 被回复者：数据里写了 to 就用它（形成对话链），否则默认是这条评论的作者
    var from = commentAuthorHTML(r.user, 'avatar-xs');
    var target = commentAuthorHTML(r.to || c.user, 'avatar-xs');
    return '<div class="reply-item">' +
      from.avatar +
      '<div style="min-width:0;flex:1">' +
        '<div class="reply-who">' +
          '<span class="reply-from">' + from.name + '</span>' +
          '<span class="reply-arrow">回复</span>' +
          '<span class="reply-to">' + target.name + '</span>' +
        '</div>' +
        '<div class="reply-text">' + linkify(r.text) + '</div>' +
        '<div class="reply-meta">' + esc(r.time) + '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  var toggle = foldable
    ? '<button type="button" class="reply-toggle" data-action="toggle-replies" data-post="' + p.id +
        '" data-idx="' + idx + '">' +
        (expanded
          ? '收起回复'
          : '展开其余 ' + (replies.length - 1) + ' 条回复' +
            '<span class="reply-more">共 ' + replies.length + ' 条</span>') +
      '</button>'
    : '';

  return '<div class="reply-list">' + items + toggle + '</div>';
}

/* 单条评论：赞 / 踩 可交互，作者赞过标记，固定回复（内容不可编辑） */
function commentItemHTML(p, c, idx, me) {
  var key = commentKey(p.id, idx);
  var vote = state.commentVote[key];
  var author = commentAuthorHTML(c.user, 'avatar-sm');

  return '<div class="comment-item">' +
    author.avatar +
    '<div style="min-width:0;flex:1">' +
      '<div class="comment-name">' +
        author.name +
        (isAuthorLiked(p.id, idx, c) ? ' <span class="author-liked">作者赞过</span>' : '') +
      '</div>' +
      '<div class="comment-text">' + linkify(c.text) + '</div>' +
      '<div class="comment-actions">' +
        '<span class="comment-time">' + esc(c.time) + '</span>' +
        '<button type="button" class="c-act' + (vote === 'like' ? ' active' : '') + '" ' +
          'data-action="comment-like" data-post="' + p.id + '" data-idx="' + idx + '">' + ICON_LIKE +
          fmtNum(commentLikes(p.id, idx, c)) + '</button>' +
        '<button type="button" class="c-act' + (vote === 'dislike' ? ' active' : '') + '" ' +
          'data-action="comment-dislike" data-post="' + p.id + '" data-idx="' + idx + '">' + ICON_DISLIKE +
          fmtNum(commentDislikes(p.id, idx, c)) + '</button>' +
      '</div>' +
      replyListHTML(p, c, idx) +
    '</div>' +
  '</div>';
}

/* ==================================================================
 * 6.1 页面渲染：动态（只看已关注用户发布的内容）
 * ================================================================== */
/* 动态卡片：小红书式（竖图 + 两行标题 + 作者/点赞） */
function xhsCardHTML(p) {
  var isVideo = p.type === 'video';
  var badge = isVideo ? '视频' : '图文 · ' + p.images.length + ' 图';
  // 假账号（氛围账号）的作品：卡片正常展示，但整张不可点击（渲染成 div，没有链接）
  var locked = isFakeAccount(p.up);
  var lockBadge = locked ? '<span class="status-badge locked">不可查看</span>' : '';

  var cover = '<img src="' + coverOf(p) + '" alt="' + esc(titleOf(p)) + '" loading="lazy">' +
      '<span class="type-badge' + (isVideo ? '' : ' note') + '">' + badge + '</span>' +
      lockBadge +
      '<span class="xhs-time">' + esc(p.publishTime.slice(5, 16)) + '</span>' +
      (isVideo ? '<span class="duration">' + esc(p.duration) + '</span>' : '');

  var foot = '<div class="xhs-foot">' +
      '<img class="avatar-xs" src="' + avatarOf(p.up) + '" alt="">' +
      '<span class="xhs-name">' + esc(nickOf(p.up)) + '</span>' +
      '<span class="xhs-like">♡ ' + fmtNum(postLikes(p)) + '</span>' +
    '</div>';

  if (locked) {
    return '<div class="xhs-card is-locked" title="演示用氛围账号的作品，不可查看">' +
      '<div class="xhs-cover">' + cover + '</div>' +
      '<div class="xhs-title">' + esc(titleOf(p)) + '</div>' +
      foot +
    '</div>';
  }

  return '<div class="xhs-card">' +
    '<a class="xhs-cover" href="#/post/' + p.id + '">' + cover + '</a>' +
    '<a class="xhs-title" href="#/post/' + p.id + '">' + esc(titleOf(p)) + '</a>' +
    foot +
  '</div>';
}

function renderDynamic() {
  var me = currentUser();
  if (!me) {
    app.innerHTML = needLoginHTML('登录后即可查看关注用户的动态');
    return;
  }

  var following = me.following || [];
  // 只展示关注者发布的公开作品（他人的私密 / 已删除作品不可见）
  var list = POSTS.filter(function (p) {
    return p.visibility === 'public' && following.indexOf(p.up) > -1;
  }).sort(function (a, b) {
    // publishTime 为定长 'YYYY-MM-DD HH:MM'，字符串倒序即为时间从新到旧
    return b.publishTime < a.publishTime ? -1 : (b.publishTime > a.publishTime ? 1 : 0);
  });

  var whoHTML = following.length
    ? '<div class="page-sub" style="margin-bottom:16px">已关注：' +
        following.map(function (u) { return esc(nickOf(u)); }).join('、') + '</div>'
    : '';

  var feedHTML = list.length
    ? '<div class="xhs-feed">' + list.map(xhsCardHTML).join('') + '</div>'
    : emptyHTML('动态还是空的', following.length
        ? '你关注的作者暂时没有公开动态'
        : '你还没有关注任何作者，去首页看看吧');

  app.innerHTML =
    '<div class="page-head">' +
      '<h2 class="page-title">动态</h2>' +
      '<span class="page-sub">共 ' + list.length + ' 条来自关注作者的更新</span>' +
    '</div>' +
    whoHTML +
    feedHTML;
}

/* ==================================================================
 * 6.2 页面渲染：个人空间（我的作品 / 我的收藏 / 创作者中心）
 * ================================================================== */
function renderSpace() {
  var me = currentUser();
  if (!me) {
    app.innerHTML = needLoginHTML('登录后即可进入个人空间');
    return;
  }

  var tab = state.spaceTab || 'works';
  var following = me.following || [];
  var TABS = [
    { key: 'works', label: '我的作品' },
    { key: 'favorites', label: '我的收藏' },
    { key: 'creator', label: '创作者中心' }
  ];

  var tabsHTML = '<div class="tabs">' + TABS.map(function (t) {
    return '<button type="button" class="tab' + (t.key === tab ? ' active' : '') + '" ' +
      'data-action="space-tab" data-tab="' + t.key + '">' + t.label + '</button>';
  }).join('') + '</div>';

  var bodyHTML = tab === 'favorites' ? spaceFavoritesHTML(me)
    : tab === 'creator' ? spaceCreatorHTML(me)
    : spaceWorksHTML(me);

  app.innerHTML =
    '<div class="card space-header">' +
      // 固定的背景图（不可更改：没有上传 / 更换入口，也没有点击交互）
      '<div class="space-cover" style="background-image:url(' + (me.cover || PLACEHOLDER_AVATAR) + ')"></div>' +
      '<div class="space-banner">' +
        '<img class="avatar-lg" src="' + me.avatar + '" alt="">' +
        '<div class="space-banner-info">' +
          '<div class="user-nick">' + esc(me.nickname) + ' 的个人空间</div>' +
          '<div class="user-sign">' + esc(me.sign) + '</div>' +
          '<div class="user-counts">' +
            '<span>@' + esc(me.username) + '</span>' +
            '<span>' + fmtNum(me.fans) + ' 粉丝</span>' +
            // 「关注 N 人」改为可点击：展开 / 收起关注列表，列表项可跳转到对方主页
            '<button type="button" class="stat-link' + (state.showFollowing ? ' active' : '') + '" ' +
              'data-action="toggle-following" data-user="' + esc(me.username) + '" title="查看我的关注列表">' +
              '关注 ' + following.length + ' 人<span class="caret">' +
              (state.showFollowing ? '▴' : '▾') + '</span></button>' +
            '<span>' + worksOf(me.username).length + ' 个作品</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    (state.showFollowing ? followingPanelHTML(me, true) : '') +
    tabsHTML +
    bodyHTML;
}

/* 关注列表：每一项点击即可跳转到该用户的主页
 * isSelf 为 true 时用于自己的个人空间（标题「我的关注」），否则用于他人名片（标题「TA 的关注」）
 */
function followingPanelHTML(user, isSelf) {
  var list = user.following || [];
  var title = isSelf ? '我的关注' : 'TA 的关注';

  var head = '<div class="follow-panel-head">' +
      '<div class="follow-panel-title">' + title + '（' + list.length + '）</div>' +
      '<div class="follow-panel-hint">点击任意用户即可跳转到 TA 的主页</div>' +
    '</div>';

  if (!list.length) {
    return '<div class="card follow-panel">' + head +
      '<div class="empty" style="padding:22px 0">' +
        (isSelf ? '还没有关注任何人' : 'TA 还没有关注任何人') +
      '</div>' +
    '</div>';
  }

  var items = list.map(function (name) {
    var u = getUser(name);
    if (!u) return '';
    // 只统计对方公开的作品数
    var count = worksOf(name).filter(function (p) { return p.visibility === 'public'; }).length;
    var inner = '<img class="avatar-sm" src="' + u.avatar + '" alt="">' +
      '<div style="min-width:0">' +
        '<div class="follow-name">' + esc(u.nickname) + '</div>' +
        '<div class="follow-sub">@' + esc(u.username) + ' · ' + count + ' 个作品</div>' +
      '</div>';
    // 假账号个人空间不开放，这里同样渲染成不可点击的静态项
    if (isProfileClosed(u.username)) {
      return '<div class="follow-item is-static" title="' +
          (isFakeAccount(u.username) ? '演示用氛围账号，主页不开放' : '该账号主页不开放') + '">' + inner +
        '<span class="follow-go">主页不开放</span></div>';
    }
    return '<a class="follow-item" href="#/user/' + u.username + '" title="进入 ' +
        esc(u.nickname) + ' 的主页">' + inner +
      '<span class="follow-go">进入主页 ›</span>' +
    '</a>';
  }).join('');

  return '<div class="card follow-panel">' + head +
    '<div class="follow-list">' + items + '</div>' +
  '</div>';
}

/* 我的作品：含公开 / 私密 / 已删除三种状态 */
function spaceWorksHTML(me) {
  var works = worksOf(me.username);
  var count = function (v) {
    return works.filter(function (p) { return p.visibility === v; }).length;
  };
  return '<div class="page-head" style="margin-top:0">' +
      '<h2 class="page-title">我的作品</h2>' +
      '<span class="page-sub">共 ' + works.length + ' 个 · 公开 ' + count('public') +
        ' · 私密 ' + count('private') + ' · 已删除 ' + count('deleted') + '</span>' +
    '</div>' +
    (works.length
      ? '<div class="post-grid">' + works.map(postCardHTML).join('') + '</div>'
      : emptyHTML('还没有作品', '点击上方「上传作品」发布第一个作品'));
}

/* 我的收藏 */
function spaceFavoritesHTML(me) {
  var ids = me.favorites || [];
  var cards = [];
  var invalid = 0;
  ids.forEach(function (id) {
    var p = getPost(id);
    if (p && canViewPost(p, me)) cards.push(postCardHTML(p));
    else invalid++;
  });

  return '<div class="page-head" style="margin-top:0">' +
      '<h2 class="page-title">我的收藏</h2>' +
      '<span class="page-sub">共 ' + ids.length + ' 个收藏' +
        (invalid ? ' · ' + invalid + ' 个已失效' : '') + '</span>' +
    '</div>' +
    (cards.length
      ? '<div class="post-grid">' + cards.join('') + '</div>'
      : emptyHTML('还没有收藏', '收藏功能仅作展示，可以先看看首页的推荐'));
}

/* 创作者中心：固定样例流量数据，不可交互、不实时更新 */
/* 纯手写 SVG 折线图：x 轴为「天」，y 轴为该作品的浏览/播放量 */
function lineChartHTML(p) {
  var data = trendOf(p);
  var W = 1100, H = 300, padL = 66, padR = 22, padT = 20, padB = 42;
  var iw = W - padL - padR, ih = H - padT - padB;
  var n = data.length;
  var max = Math.max.apply(null, data);
  var top = max * 1.15 || 1;                       // y 轴上限留 15% 余量
  var px = function (i) { return padL + (n === 1 ? iw / 2 : iw * i / (n - 1)); };
  var py = function (v) { return padT + ih - (v / top) * ih; };

  var pts = data.map(function (v, i) { return px(i).toFixed(1) + ',' + py(v).toFixed(1); });
  var area = padL + ',' + (padT + ih) + ' ' + pts.join(' ') + ' ' + (padL + iw).toFixed(1) + ',' + (padT + ih);

  // 横向网格线 + y 轴刻度
  var grid = '';
  for (var g = 0; g <= 4; g++) {
    var gy = padT + ih * g / 4;
    var gv = Math.round(top * (4 - g) / 4);
    grid += '<line x1="' + padL + '" y1="' + gy.toFixed(1) + '" x2="' + (padL + iw) + '" y2="' + gy.toFixed(1) +
              '" stroke="#eef0f2" stroke-width="1"/>' +
            '<text x="' + (padL - 10) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" ' +
              'fill="#9499a0" font-size="12">' + fmtNum(gv) + '</text>';
  }

  // 数据点 + x 轴（天）
  var dots = '', labels = '';
  data.forEach(function (v, i) {
    dots += '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(v).toFixed(1) + '" r="4.5" ' +
              'fill="#fff" stroke="#12a56f" stroke-width="2.5"><title>' + TREND_DAYS[i] + '：' + fmtNum(v) + '</title></circle>';
    labels += '<text x="' + px(i).toFixed(1) + '" y="' + (padT + ih + 22) + '" text-anchor="middle" ' +
                'fill="#61666d" font-size="12">' + TREND_DAYS[i] + '</text>';
  });

  return '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="' + esc(titleOf(p) || '作品') + ' 近 7 天浏览趋势折线图">' +
    '<defs><linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#65e2a6" stop-opacity=".42"/>' +
      '<stop offset="100%" stop-color="#65e2a6" stop-opacity=".04"/>' +
    '</linearGradient></defs>' +
    grid +
    '<polygon points="' + area + '" fill="url(#chartFill)"/>' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#12a56f" stroke-width="3" ' +
      'stroke-linejoin="round" stroke-linecap="round"/>' +
    dots + labels +
  '</svg>';
}

/* 折线图面板：左右按钮横向切换不同作品 */
function trendPanelHTML(works) {
  if (!works.length) return '';
  var idx = Math.min(state.chartIndex, works.length - 1);
  if (idx < 0) idx = 0;
  var p = works[idx];
  var data = trendOf(p);
  var total = data.reduce(function (a, b) { return a + b; }, 0);

  return '<div class="card chart-card" id="chartCard">' +
    '<div class="chart-head">' +
      '<div>' +
        '<div class="chart-title">作品浏览趋势 · 近 7 天</div>' +
        '<div class="chart-sub">《' + esc(titleOf(p) || '（无标题）') + '》 · ' +
          (p.type === 'video' ? '视频' : '图文') + ' · 7 天合计 ' + fmtNum(total) + '</div>' +
      '</div>' +
      '<div class="chart-nav">' +
        '<button type="button" class="chart-btn" data-action="chart-prev" title="上一个作品" ' +
          'aria-label="上一个作品"' + (idx <= 0 ? '' : '') + '>‹</button>' +
        '<span class="chart-pos">' + (idx + 1) + ' / ' + works.length + '</span>' +
        '<button type="button" class="chart-btn" data-action="chart-next" title="下一个作品" ' +
          'aria-label="下一个作品">›</button>' +
      '</div>' +
    '</div>' +
    lineChartHTML(p) +
    '<div class="chart-note">＊ 虚线网格为浏览/播放量刻度，x 轴为日期；左右按钮可横向切换作品。</div>' +
  '</div>';
}

/* 切换作品后只重绘图表卡片，避免整页跳动 */
function setChartIndex(works, index) {
  var n = works.length;
  if (!n) return;
  state.chartIndex = ((index % n) + n) % n;      // 循环切换
  var host = document.getElementById('chartCard');
  if (!host) return;
  var wrap = document.createElement('div');
  wrap.innerHTML = trendPanelHTML(works);
  host.replaceWith(wrap.firstChild);
}

function spaceCreatorHTML(me) {
  var works = worksOf(me.username);

  // 没有作品时流量看板全是 0，没有展示意义，直接给出空状态
  if (!works.length) {
    return '<div class="page-head" style="margin-top:0">' +
        '<h2 class="page-title">创作者中心</h2>' +
      '</div>' +
      emptyHTML('您尚未发布作品', '发布作品后这里会展示流量数据');
  }

  var sum = { exposure: 0, plays: 0, likes: 0, comments: 0, collects: 0, fans: 0 };

  var rows = works.map(function (p) {
    var t = trafficOf(p);
    sum.exposure += t.exposure; sum.plays += t.plays; sum.likes += t.likes;
    sum.comments += t.comments; sum.collects += t.collects; sum.fans += t.fans;

    return '<tr>' +
      '<td class="strong">' + esc(titleOf(p)) + '</td>' +
      '<td><span class="v-tag">' + (p.type === 'video' ? '视频' : '图文') + '</span></td>' +
      '<td>' + VISIBILITY[p.visibility].label + '</td>' +
      '<td>' + fmtNum(t.exposure) + '</td>' +
      '<td class="strong">' + fmtNum(t.plays) + '</td>' +
      '<td>' + fmtNum(t.likes) + '</td>' +
      '<td>' + fmtNum(t.comments) + '</td>' +
      '<td>' + fmtNum(t.collects) + '</td>' +
      '<td>' + fmtNum(t.fans) + '</td>' +
      '<td>' + t.finish + '%</td>' +
      '<td>' + t.interact + '%</td>' +
    '</tr>';
  }).join('');

  var cardsHTML = '<div class="stat-cards">' +
    statCard(fmtNum(sum.exposure), '总曝光量') +
    statCard(fmtNum(sum.plays), '总播放/浏览') +
    statCard(fmtNum(sum.likes), '总点赞') +
    statCard(fmtNum(sum.fans), '本月累计涨粉') +
  '</div>';

  var tableHTML = '<div class="card" style="padding:4px 4px 0;overflow:hidden">' +
      '<table class="data-table"><thead><tr>' +
        '<th>作品</th><th>类型</th><th>状态</th><th>曝光量</th><th>播放/浏览</th>' +
        '<th>点赞</th><th>评论</th><th>收藏</th><th>涨粉</th><th>完播率</th><th>互动率</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
    '</div>';

  return '<div class="page-head" style="margin-top:0">' +
      '<h2 class="page-title">创作者中心</h2>' +
      '<span class="page-sub">以下为固定的样例数据，仅作展示，不可交互</span>' +
    '</div>' +
    cardsHTML +
    trendPanelHTML(works) +
    tableHTML +
    '<div class="table-note">＊ 数据说明：曝光量、完播率、互动率为预设样例，页面不做实时更新。</div>';
}

/* 图文帖画廊：把当前下标渲染成可点击的缩略图列表 */

/* 切换画廊当前图片：只更新 DOM，避免整页重绘 */
function setGalleryImage(postId, index) {
  var p = getPost(postId);
  if (!p || p.type !== 'note') return;

  var total = p.images.length;
  index = ((index % total) + total) % total;   // 循环切换
  state.gallery[p.id] = index;

  var main = document.getElementById('galleryMain');
  if (main) main.src = p.images[index];

  var idxEl = document.getElementById('galleryIndex');

  for (var i = 0; i < thumbs.length; i++) {

    thumbs[i].className = on ? 'thumb active' : 'thumb';
  }
}
